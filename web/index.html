<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שרטוטי</title>
<meta name="description" content="שרטוטי – סקיצות עם מידות, שטח והיקף, להצעות מחיר בשטח">
<meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שרטוטי">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: graph-paper board fills the screen; header on top, editing sheet slides up from the bottom on phones and docks to the right on desktop */
:root{
  --paper:#f3f4f0; --board:#fbfbf8; --panel:#ffffff;
  --ink:#1c232d; --ink-2:#5d6774; --line:#d8dcd3;
  --grid:#e8ebe4; --grid-major:#cdd3c8;
  --accent:#c4501a; --accent-ink:#ffffff; --accent-soft:#f6e3d8;
  --danger:#b3261e;
  --font:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --shadow:0 -6px 24px rgba(20,28,38,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181d; --board:#1a1f25; --panel:#20262e;
  --ink:#e8ebef; --ink-2:#9ba5b2; --line:#303842;
  --grid:#222931; --grid-major:#323b46;
  --accent:#f0814a; --accent-ink:#1a1f25; --accent-soft:#3a2a21;
  --danger:#ff7a6e; --shadow:0 -6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14181d; --board:#1a1f25; --panel:#20262e;
  --ink:#e8ebef; --ink-2:#9ba5b2; --line:#303842;
  --grid:#222931; --grid-major:#323b46;
  --accent:#f0814a; --accent-ink:#1a1f25; --accent-soft:#3a2a21;
  --danger:#ff7a6e; --shadow:0 -6px 24px rgba(0,0,0,.45); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* header */
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.titlebox{flex:1;min-width:0;display:flex;flex-direction:column}
.titlebox input{border:0;background:transparent;font-weight:500;font-size:17px;padding:2px 0;min-width:0;width:100%}
.titlebox input:focus{outline:none;border-bottom:1px solid var(--accent)}
.status{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{border:1px solid var(--line);background:var(--board);border-radius:8px;padding:4px 10px;text-align:center;line-height:1.15;flex:none}
.total b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.total small{font-size:11px;color:var(--ink-2)}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--paper)}
.top .ib.on{color:var(--accent);background:var(--accent-soft)}
.acct{display:flex;flex-direction:column;gap:2px;background:var(--paper);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.fold{display:flex;flex-direction:column;gap:4px;background:var(--paper);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.fold b{color:var(--ink);font-size:14.5px}
.fpath{font-size:12.5px;word-break:break-all;text-align:right;color:var(--ink)}
.acct span{color:var(--ink-2);font-size:13.5px;text-align:right}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.icons{display:flex;gap:2px;flex:none}

/* main */
.main{position:relative;display:grid;grid-template-columns:1fr;min-height:0}
.boardwrap{position:relative;min-height:0;min-width:0;background:var(--board)}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#board text{font-family:var(--font);pointer-events:none}
.g-min{stroke:var(--grid);stroke-width:1}
.g-maj{stroke:var(--grid-major);stroke-width:1}
.el{fill:var(--ink);stroke:var(--board);paint-order:stroke;stroke-linejoin:round;font-variant-numeric:tabular-nums;font-weight:500}
.cn{fill:var(--ink);stroke:var(--board);paint-order:stroke;font-weight:700}
.ca{fill:var(--accent);stroke:var(--board);paint-order:stroke;font-weight:700;font-variant-numeric:tabular-nums}
.cp{fill:var(--ink-2);stroke:var(--board);paint-order:stroke;font-variant-numeric:tabular-nums}
.sel{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
.vdot{fill:var(--board);stroke:var(--accent);stroke-width:2;pointer-events:none}
.rh{fill:var(--accent);stroke:var(--board);stroke-width:2;cursor:grab}
.rhl{stroke:var(--accent);stroke-width:1.5}

.hl{stroke:var(--accent);stroke-width:7;stroke-opacity:.4;stroke-linecap:round;pointer-events:none}
.dline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dprev{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.dstroke{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.75}
.dvtx{fill:var(--accent)}
.dstart{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dcur{fill:none;stroke:var(--accent);stroke-width:2}
#board.drawing{cursor:crosshair}
.addg{display:flex;gap:8px;flex-wrap:wrap}
.add.alt{background:var(--panel);color:var(--accent);border:1px solid var(--accent);box-shadow:none}
.drawbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 56px);box-shadow:0 4px 14px rgba(20,28,38,.12)}
.dhint{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.drow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.segctl{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segctl button{border:0;background:var(--board);padding:7px 10px;font-size:14px}
.segctl button.on{background:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.4;cursor:default}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-2);text-align:center;padding:16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.scalebar{position:absolute;top:12px;inset-inline-start:12px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none}
.scalebar i{display:block;height:6px;border:2px solid var(--ink-2);border-top:0}

.dock{position:absolute;bottom:14px;inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock > *{pointer-events:auto}
.add{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:500;box-shadow:0 4px 14px rgba(196,80,26,.3)}
.add svg{width:20px;height:20px}
.tools{display:flex;flex-direction:column;gap:6px}
.tools .ib{background:var(--panel);border-color:var(--line)}
.tools .ib.on{color:var(--accent);border-color:var(--accent)}

/* sheet */
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:52%;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-block:6px 18px;padding-inline:16px;z-index:5;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
@media (min-width:900px){
  .main.has-panel{grid-template-columns:340px 1fr}
  .sheet{position:relative;max-height:none;border-radius:0;box-shadow:none;border-inline-end:1px solid var(--line);inset:auto}
  .grab{display:none}
}
.shead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.shead input{flex:1;min-width:0;font-size:17px;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--board)}
.kind{font-size:12px;color:var(--ink-2);margin-bottom:8px;letter-spacing:.02em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld > span{font-size:12.5px;color:var(--ink-2)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--board);overflow:hidden}
.inp input{border:0;background:transparent;padding:9px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums;font-size:16px;text-align:left}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--accent)}
.inp em{font-style:normal;color:var(--ink-2);padding-inline:8px;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.lbl{font-size:12.5px;color:var(--ink-2);min-width:52px}
.chip{border:1px solid var(--line);background:var(--board);border-radius:8px;padding:7px 10px;font-size:14px;display:inline-flex;gap:5px;align-items:center}
.chip svg{width:16px;height:16px}
.chip:hover{border-color:var(--ink-2)}
.chip.danger{color:var(--danger)}
.chip.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.rot .inp{width:96px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.tg{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--accent)}
.info{margin-top:12px;display:flex;gap:16px;background:var(--paper);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.info div{display:flex;flex-direction:column}
.info small{color:var(--ink-2);font-size:12px}
.info b{font-size:17px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.hint{color:var(--ink-2);font-size:12.5px;margin-top:6px;line-height:1.45}
.segs{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:22px 1fr 1fr 32px;gap:6px;align-items:center}
.seg b{font-size:13px;color:var(--ink-2);text-align:center}
.seg .x{border:0;background:transparent;color:var(--ink-2);height:32px}
.seghead{display:grid;grid-template-columns:22px 1fr 1fr 32px;gap:6px;font-size:12px;color:var(--ink-2)}
.closing{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.closing b{color:var(--ink)}

/* picker */
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{border:1px solid var(--line);background:var(--board);border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;text-align:center}
.pick svg{width:40px;height:30px;fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.pick:hover{border-color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 16px}
.card h2{margin:0 0 12px;font-size:18px;text-wrap:balance;display:flex;justify-content:space-between;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font-weight:500;color:var(--ink-2);font-size:12.5px}
td.n,th.n{text-align:left}
tfoot td{font-weight:700;border-bottom:0}
.sklist{display:flex;flex-direction:column;gap:8px}
.sk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sk.cur{border-color:var(--accent)}
.sk .meta{flex:1;min-width:0}
.sk .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk .meta small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:500}
.expimg{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--board);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;pointer-events:none;max-width:90vw;text-align:center}

/* project document */
.docv{position:fixed;inset:0;z-index:12;background:var(--paper);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.docv .top .chip{flex:none}
.dscroll{overflow:auto;min-height:0;padding-inline:16px;padding-block:18px 120px}
.dpage{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding-block:22px 28px;padding-inline:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:18px}
.dmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dmeta label{display:flex;flex-direction:column;gap:3px;min-width:0}
.dmeta span{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.dmeta input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;font-size:15.5px;min-width:0;width:100%}
.dmeta input:focus{outline:none;border-bottom-color:var(--accent)}
.blocks{display:flex;flex-direction:column;gap:4px}
.blk{position:relative;border-radius:8px;padding:4px 6px;margin-inline:-6px}
.blk:focus-within,.blk:hover{background:var(--paper)}
.bctl{position:absolute;top:-16px;inset-inline-end:6px;z-index:2;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:0 2px 8px rgba(20,28,38,.12)}
.blk:focus-within .bctl{display:flex}
@media (hover:hover){.blk:hover .bctl{display:flex}}
.bctl button{border:0;background:transparent;color:var(--ink-2);width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:12px}
.bctl button:hover{background:var(--line);color:var(--ink)}
.bctl button.armed{width:auto;padding-inline:8px;background:var(--danger);color:#fff}
.bctl svg{width:16px;height:16px}
.bh,.bp,.bt{border:0;background:transparent;width:100%;min-width:0;font-family:var(--font);color:var(--ink);padding:4px 0}
.bh{font-size:20px;font-weight:700;text-wrap:balance}
.bp{font-size:15.5px;line-height:1.6;resize:none;overflow:hidden;display:block}
.bh:focus,.bp:focus,.bt:focus{outline:none}
.btodo{display:flex;align-items:center;gap:10px}
.btodo input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none;margin:0}
.bt{font-size:15.5px}.bt.done{text-decoration:line-through;color:var(--ink-2)}
.bsk{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;padding:0;width:100%;text-align:right;cursor:pointer}
.bsk:hover{border-color:var(--accent)}
.bsk img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff}
.bsk .cap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:var(--paper);border-top:1px solid var(--line);color:var(--ink);font-size:14px}
.bsk .cap span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bsk .cap .ed{margin-inline-start:auto;color:var(--accent);display:inline-flex;gap:4px;align-items:center}
.bsk .cap svg{width:15px;height:15px}
.bmiss{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--ink-2);text-align:center}
.bareas{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bat{font-weight:700;margin-bottom:6px}
.bareas tr.sub td{font-weight:500;color:var(--ink-2)}
.bareas tr.grp td{font-weight:700;background:var(--paper);border-bottom:0;padding-top:10px}
.addbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:14px;border-top:1px dashed var(--line);color:var(--ink-2);font-size:13px}
.chip.accent{border-color:var(--accent);color:var(--accent)}
.chip svg{width:15px;height:15px}
.backdoc{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;display:inline-flex;gap:6px;align-items:center;max-width:calc(100% - 32px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 14px;font-weight:500;box-shadow:0 4px 14px rgba(196,80,26,.3)}
.backdoc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backdoc svg{width:16px;height:16px;transform:rotate(90deg)}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tabs button{flex:1;border:0;background:var(--board);padding:9px;font-size:14.5px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
@media (max-width:420px){ .top{gap:4px;padding-inline:12px} .ib{width:34px} .total{padding:3px 7px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
@media (min-width:900px){ .sheet{animation:none} }
</style>
</head>
<body>
<div class="app" dir="rtl">
  <header class="top">
    <div class="titlebox">
      <input id="skname" aria-label="שם הסקיצה" value="">
      <span class="status" id="status"></span>
    </div>
    <button class="total" id="totalBtn" title="סיכום שטחים"><b id="totalA">0.00</b><small>מ״ר סה״כ</small></button>
    <div class="icons">
      <button class="ib" id="undoBtn" title="ביטול" aria-label="ביטול"></button>
      <button class="ib" id="redoBtn" title="שחזור" aria-label="שחזור"></button>
      <button class="ib" id="acctBtn" hidden aria-label="חשבון Google"></button>
      <button class="ib" id="listBtn" title="הסקיצות שלי" aria-label="הסקיצות שלי"></button>
      <button class="ib" id="expBtn" title="שמירה כתמונה" aria-label="שמירה כתמונה"></button>
    </div>
  </header>
  <div class="main" id="main">
    <aside class="sheet" id="sheet" hidden></aside>
    <div class="boardwrap" id="wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      <button class="backdoc" id="backDoc" hidden></button>
      <div class="scalebar" id="scalebar"><i></i><span></span></div>
      <div class="empty" id="empty" hidden><div><b>הלוח ריק</b>לחץ על „הוספת צורה" או „שרטוט ידני" כדי להתחיל</div></div>
      <div class="dock" id="dock">
        <div class="addg" id="addGroup"><button class="add" id="addBtn"></button><button class="add alt" id="drawBtn"></button></div>
        <div class="drawbar" id="drawbar" hidden>
          <div class="dhint" id="dhint"></div>
          <div class="drow">
            <div class="segctl"><button id="dmPts" class="on">נקודה אחר נקודה</button><button id="dmFree">יד חופשית</button></div>
            <button class="chip" id="dUndo">בטל נקודה</button>
            <button class="chip" id="dDone">סיום (קו פתוח)</button>
            <button class="chip" id="dCancel">יציאה</button>
          </div>
        </div>
        <div class="tools">
          <button class="ib on" id="magBtn" title="הצמדה לפינות" aria-label="הצמדה לפינות"></button>
          <button class="ib" id="zinBtn" title="הגדלה" aria-label="הגדלה"></button>
          <button class="ib" id="zoutBtn" title="הקטנה" aria-label="הקטנה"></button>
          <button class="ib" id="fitBtn" title="התאמה למסך" aria-label="התאמה למסך"></button>
        </div>
      </div>
    </div>
  </div>

/* ---------- geometry ---------- */
function localGeom(s){
  const p=s.p; let pts=[],closed=true,err='',circle=null,closeLen=null;
  switch(s.kind){
    case 'rect': pts=[[0,0],[p.w,0],[p.w,p.h],[0,p.h]]; break;
    case 'tri': {
      const a=p.a,b=p.b,c=p.c; const x=(a*a+c*c-b*b)/(2*a); let y2=c*c-x*x;
      if(!(a<b+c&&b<a+c&&c<a+b)){err='שלוש הצלעות האלה לא יוצרות משולש: כל צלע צריכה להיות קצרה מסכום שתי האחרות.';}
      pts=[[0,0],[a,0],[x,-Math.sqrt(Math.max(y2,0))]]; break; }
    case 'trap': pts=[[0,0],[p.a,0],[p.o+p.b,-p.h],[p.o,-p.h]]; break;
    case 'reg': { const n=Math.round(p.n),R=p.s/(2*Math.sin(Math.PI/n));
      for(let i=0;i<n;i++){const t=Math.PI/2+Math.PI/n+2*Math.PI*i/n;pts.push([R*Math.cos(t),R*Math.sin(t)]);} break; }
    case 'L': { const {w,h}=p; let cw=p.cw,ch=p.ch;
      if(cw>=w||ch>=h){err='מידות החיתוך צריכות להיות קטנות מהמידות הכוללות.';cw=Math.min(cw,w*.98);ch=Math.min(ch,h*.98);}
      pts=[[0,0],[w-cw,0],[w-cw,ch],[w,ch],[w,h],[0,h]]; break; }
    case 'free': { let x=0,y=0,hd=0; pts=[[0,0]];
      p.segs.forEach(g=>{x+=g.len*Math.cos(hd);y+=g.len*Math.sin(hd);pts.push([x,y]);hd+=(180-g.ang)*Math.PI/180;});
      if(p.open){ closed=false; if(pts.length<2) err='צריך לפחות צלע אחת.'; }
      else{ closeLen=Math.hypot(x,y); if(closeLen<1e-6) pts.pop();
        if(pts.length<3) err='צריך לפחות שתי צלעות.'; }
      break; }
    case 'circle': circle=p.r; pts=[[-p.r,-p.r],[p.r,-p.r],[p.r,p.r],[-p.r,p.r]]; break;
    case 'line': pts=[[0,0],[p.len,0]]; closed=false; break;
  }
  if(s.flip&&!circle) pts=pts.map(([x,y])=>[-x,y]);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
  const cx=(x0+x1)/2,cy=(y0+y1)/2; pts=pts.map(([x,y])=>[x-cx,y-cy]);
  return {pts,closed,err,circle,closeLen,hw:(x1-x0)/2,hh:(y1-y0)/2};
}
function geom(s){
  const g=localGeom(s),r=s.rot*Math.PI/180,c=Math.cos(r),n=Math.sin(r);
  g.w=g.pts.map(([x,y])=>[s.x+x*c-y*n,s.y+x*n+y*c]); return g;
}
function sarea(P){let A=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];A+=a[0]*b[1]-b[0]*a[1];}return A/2;}
const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
function measures(s,g){
  if(g.circle) return {area:Math.PI*g.circle*g.circle,per:2*Math.PI*g.circle};
  if(!g.closed){let L=0;for(let i=0;i<g.pts.length-1;i++)L+=dist(g.pts[i],g.pts[i+1]);return {area:0,per:L};}
  let P=0;for(let i=0;i<g.pts.length;i++)P+=dist(g.pts[i],g.pts[(i+1)%g.pts.length]);
  return {area:Math.abs(sarea(g.pts)),per:P};
}
function centroid(P){
  const A=sarea(P); if(Math.abs(A)<1e-9){let x=0,y=0;P.forEach(p=>{x+=p[0];y+=p[1]});return [x/P.length,y/P.length];}
  let cx=0,cy=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],f=a[0]*b[1]-b[0]*a[1];cx+=(a[0]+b[0])*f;cy+=(a[1]+b[1])*f;}
  return [cx/(6*A),cy/(6*A)];
}

/* ---------- drawing (screen coords via T={k,ox,oy}) ---------- */
function shapeSVG(s,T,o){
  const g=geom(s),m=measures(s,g),fs=o.fs,col=s.color||PALETTE[0];

    body=`<circle${id} cx="${C[0]}" cy="${C[1]}" r="${g.circle*T.k}" fill="${col}" fill-opacity="0.16" stroke="${col}" stroke-width="2"/>`;
  }else if(g.closed){
    body=`<polygon${id} points="${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${col}" fill-opacity="0.16" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  }else{
    const pl=P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const tick=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*7,ny=dx/L*7;
      return `<line x1="${a[0]-nx}" y1="${a[1]-ny}" x2="${a[0]+nx}" y2="${a[1]+ny}" stroke="${col}" stroke-width="2.5"/>`;};
    const n=P.length;

      `<polyline points="${pl}" fill="none" stroke="${col}" stroke-width="${s.kind==='line'?2.5:3}" stroke-linejoin="round"${s.kind==='line'?' stroke-dasharray="7 4"':''}/>`+
      tick(P[0],P[1])+tick(P[n-1],P[n-2])+`</g>`;
  }
  // side lengths
  if(s.labels!==false&&!g.circle){
    const n=g.closed?P.length:P.length-1,A=sarea(P);
    for(let i=0;i<n;i++){
      const a=P[i],b=P[(i+1)%P.length],dx=b[0]-a[0],dy=b[1]-a[1],sl=Math.hypot(dx,dy);
      if(sl<(o.exp?8:26)) continue;
      const L=dist(g.pts[i],g.pts[(i+1)%g.pts.length]);
      let nx=dy/sl,ny=-dx/sl; // outward if A>0
      if(g.closed){ if(A<0){nx=-nx;ny=-ny;} nx=-nx;ny=-ny; } // closed: place inside the shape
      else if(ny>0||(Math.abs(ny)<1e-6&&nx>0)){nx=-nx;ny=-ny;}
      const off=fs*.75+5,x=(a[0]+b[0])/2+nx*off,y=(a[1]+b[1])/2+ny*off;
      let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90)ang-=180; if(ang<-90)ang+=180;
      lab+=`<text class="el" x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${ang.toFixed(2)} ${x.toFixed(1)} ${y.toFixed(1)})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" stroke-width="4">${fmt(L)}</text>`;
    }
  }
  // centre label
  const nm=esc(s.name||'');
  if(g.closed){
    const c=g.circle?C:centroid(P);
    const bw=Math.min(g.hw,g.hh)*2*T.k;

    else{
      if(nm) lines.push(['cn',nm,fs*1.1]);
      if(showA) lines.push(['ca',fmt(m.area)+' מ״ר',fs*1.05]);
      if(s.showPer!==false) lines.push(['cp','היקף '+fmt(m.per)+' מ׳',fs*.88]);
      if(g.circle) lines.push(['cp','רדיוס '+fmt(g.circle)+' מ׳',fs*.88]);
    }
    const lh=1.32; let tot=lines.reduce((t,l)=>t+l[2]*lh,0),y=c[1]-tot/2;
    lines.forEach(([cl,t,f])=>{y+=f*lh/2;lab+=`<text class="${cl}" x="${c[0].toFixed(1)}" y="${y.toFixed(1)}" font-size="${f.toFixed(1)}" text-anchor="middle" dominant-baseline="central" direction="rtl" stroke-width="4">${t}</text>`;y+=f*lh/2;});
  }else if(nm){
    let bi=0,bl=-1; for(let i=0;i<P.length-1;i++){const l=dist(P[i],P[i+1]);if(l>bl){bl=l;bi=i;}}
    const a=P[bi],b=P[bi+1],dx=b[0]-a[0],dy=b[1]-a[1],sl=Math.hypot(dx,dy)||1;
    let nx=dy/sl,ny=-dx/sl; if(ny>0||(Math.abs(ny)<1e-6&&nx>0)){nx=-nx;ny=-ny;}
    const x=(a[0]+b[0])/2-nx*(fs*.8+5),y=(a[1]+b[1])/2-ny*(fs*.8+5);
    let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90)ang-=180; if(ang<-90)ang+=180;
    lab+=`<text class="cp" x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${ang.toFixed(2)} ${x.toFixed(1)} ${y.toFixed(1)})" font-size="${fs*.9}" text-anchor="middle" dominant-baseline="central" direction="rtl" stroke-width="4">${nm}</text>`;
  }

}
function selSVG(s,T){
  const g=geom(s),P=g.w.map(([x,y])=>[x*T.k+T.ox,y*T.k+T.oy]),C=[s.x*T.k+T.ox,s.y*T.k+T.oy];
  let o='';
  if(g.circle) o+=`<circle class="sel" cx="${C[0]}" cy="${C[1]}" r="${g.circle*T.k+5}"/>`;
  else if(g.closed) o+=`<polygon class="sel" points="${P.map(p=>p.join(',')).join(' ')}"/>`;
  if(focusSide!=null&&s.kind==='free'&&!g.circle){
    const i=focusSide,a=P[i],b=g.closed?P[(i+1)%P.length]:P[i+1];
    if(a&&b) o+=`<line class="hl" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  }
  if(!g.circle) P.forEach(p=>o+=`<circle class="vdot" cx="${p[0]}" cy="${p[1]}" r="4"/>`);
  if(!g.circle){
    const r=s.rot*Math.PI/180,ux=Math.sin(r),uy=-Math.cos(r),d0=g.hh*T.k,d1=d0+34;

      `<path d="M${hx+4.5} ${hy-1.5}a4.6 4.6 0 1 1-1.4-3.2M${hx+3.6} ${hy-6.2}v3.4h-3.4" fill="none" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round"/></g>`;
  }

}
function gridSVG(T,W,H){
  const steps=[0.1,0.25,0.5,1,2,5,10,25,50,100];const st=steps.find(x=>x*T.k>=16)||200;
  const maj=st<1?1:st*5;let mi='',ma='';
  const xs=Math.floor(-T.ox/T.k/st)*st,ys=Math.floor(-T.oy/T.k/st)*st;
  for(let x=xs;x*T.k+T.ox<=W;x+=st){const X=Math.round(x*T.k+T.ox)+.5,isM=Math.abs(x/maj-Math.round(x/maj))<1e-6;(isM?(ma+=`M${X} 0V${H}`):(mi+=`M${X} 0V${H}`));}
  for(let y=ys;y*T.k+T.oy<=H;y+=st){const Y=Math.round(y*T.k+T.oy)+.5,isM=Math.abs(y/maj-Math.round(y/maj))<1e-6;(isM?(ma+=`M0 ${Y}H${W}`):(mi+=`M0 ${Y}H${W}`));}
  return `<path class="g-min" d="${mi}"/><path class="g-maj" d="${ma}"/>`;
}

const folder={
  K:'sirtuti.folder',M:'sirtuti.folderFiles',warned:false,
  get path(){try{return localStorage.getItem(this.K)||''}catch(e){return ''}},

  on(){return this.supported()&&!!this.path},
  join(n){const p=this.path,sep=p.includes('\\')?'\\':'/';return p.replace(/[\\/]+$/,'')+sep+n;},
  fname(s){const nm=(s.name||'סקיצה').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').trim().slice(0,60)||'סקיצה';return nm+' ('+String(s.id).slice(-6)+').sirtuti.json';},
  fail(){ if(!this.warned){this.warned=true;toast('השמירה לתיקייה נכשלה. בדוק שהתיקייה קיימת');} },
  async write(s){
    if(!this.on()) return;
    const fs=this.fs(),m=this.map(),n=this.fname(s),old=m[s.id],at=this.path;
    await fs.writeTextFile(this.join(n),JSON.stringify({app:'sirtuti',format:1,sketch:{id:s.id,...plain(s)}},null,1));
    if(old&&old!==n){try{await fs.remove(this.join(old));}catch(e){}}
    m[s.id]=n; this.setMap(m); this.warned=false;
    const cur=local.all()[s.id]; if(cur&&cur.updated===s.updated&&cur.inFolder!==at){cur.inFolder=at;local.put(cur);}
  },
  async remove(id){
    if(!this.on()) return; const m=this.map(),n=m[id]; if(!n) return;
    try{await this.fs().remove(this.join(n));}catch(e){}
    delete m[id]; this.setMap(m);
  },
  // read the folder; newer files win; files deleted on another computer remove the local copy
  async pull(){
    if(!this.on()) return 0;
    const fs=this.fs(),at=this.path,ents=await fs.readDir(at),m={},seen=new Set(); let n=0;
    for(const e of ents){
      if(!e.isFile||!/\.sirtuti\.json$/i.test(e.name)) continue;
      try{
        const d=JSON.parse(await fs.readTextFile(this.join(e.name))),s=d&&d.sketch;
        if(!s||!s.id||!Array.isArray(s.shapes)) continue;
        seen.add(s.id); m[s.id]=e.name;
        const cur=local.all()[s.id];
        if(!cur||(cur.updated||0)<(s.updated||0)){local.put({id:s.id,...plain(s),inFolder:at});n++;}
      }catch(err){}
    }
    Object.values(local.all()).forEach(s=>{if(s.inFolder===at&&!seen.has(s.id)){local.del(s.id);n++;}});
    this.setMap(m); return n;
  },
  async pushAll(){ for(const s of Object.values(local.all())) await this.write(s); },
  async choose(){
    try{
      const p=await window.__TAURI__.dialog.open({directory:true,multiple:false,recursive:true,title:'בחירת תיקייה לשמירה אוטומטית'});
      if(!p||Array.isArray(p)) return false;
      this.path=p; this.setMap({}); this.warned=false;
      await this.pull(); await this.pushAll();
      toast('נשמר. כל שינוי יישמר גם בתיקייה'); return true;
    }catch(e){ this.fail(); return false; }
  },
  stop(){ this.path=''; this.setMap({}); toast('השמירה לתיקייה הופסקה. הקבצים שכבר נשמרו נשארים שם'); }
};
let syncSt='';
const store={remote:null,
  get mode(){return this.remote?this.remote.kind:'local'},
  async initClaude(){
    try{
      if(!window.claude||!window.claude.use) return;
      const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
      if(!user||!db) return; const id=await user.id(); if(!id) return;
      const col=()=>db.collection('data/users/'+id);
      this.remote={kind:'claude',uid:id,
        list:async()=>({docs:(await col().get()).docs.map(d=>({id:d.id,...d.data()})),fromServer:true}),
        save:(sid,body)=>col().doc(sid).set(body),
        remove:sid=>col().doc(sid).delete()};
    }catch(e){}
  },
  async list(){
    if(folder.on()){try{await folder.pull();}catch(e){folder.fail();}}
    const L=local.all(),all={};
    Object.values(L).forEach(s=>{if(s&&Array.isArray(s.shapes)) all[s.id]=s;});
    const r=this.remote;
    if(r){
      try{
        const {docs,fromServer}=await r.list(),ids=new Set(docs.map(d=>d.id));
        // deleted on another device: drop local copies that were confirmed in the cloud but are gone now
        if(r.kind==='firebase'&&fromServer) Object.values(L).forEach(s=>{if(s.cloud===r.uid&&!ids.has(s.id)){local.del(s.id);delete all[s.id];}});
        docs.forEach(o=>{
          if(!Array.isArray(o.shapes)) return; const cur=all[o.id];
          if(!cur||(cur.updated||0)<=(o.updated||0)){ all[o.id]=o; if(r.kind==='firebase') local.put({...o,cloud:r.uid}); }
        });
      }catch(e){}
    }
    return Object.values(all).sort((a,b)=>(b.updated||0)-(a.updated||0));
  },
  async save(s){
    const body=plain(s),prev=local.all()[s.id];
    local.put({...(prev||{}),id:s.id,...body});
    if(folder.on()) folder.write({id:s.id,...body}).catch(()=>folder.fail());
    const r=this.remote; if(!r) return;
    if(r.kind==='claude'){ await r.save(s.id,body); return; }
    pushCloud(r,s.id,body);   // Firebase: never block on the server (works offline, syncs later)
  },
  async remove(id){
    local.del(id); if(folder.on()) folder.remove(id); const r=this.remote; if(!r) return;
    const p=r.remove(id); if(r.kind==='claude') await p; else p.catch(()=>{});
  }
};
function pushCloud(r,id,body){
  setSync('pending');
  r.save(id,body).then(()=>{
    const cur=local.all()[id]; if(cur&&cur.updated===body.updated){cur.cloud=r.uid;local.put(cur);}
    if(store.remote===r) setSync('ok');
  }).catch(()=>{ if(store.remote===r) setSync('err'); });
}
function setSync(st){ syncSt=st; if(!saving&&!saveT&&!sk.example) setStatus(savedText()); }
let saveT=null,saving=false,again=false;
function setStatus(t){$('#status').textContent=t;}
function savedText(){
  if(store.mode==='claude') return 'נשמר בחשבון שלך';
  if(store.mode==='firebase') return syncSt==='pending'?'נשמר · מסנכרן ל-Google…':syncSt==='err'?'נשמר במכשיר · הסנכרון ל-Google נכשל':'נשמר בחשבון Google';
  return IS_TAURI?(folder.on()?'נשמר במחשב ובתיקייה':'נשמר במחשב הזה'):'נשמר בדפדפן הזה';
}
function scheduleSave(){
  sk.example=false;sk.updated=Date.now();setStatus('שומר…');
  clearTimeout(saveT);saveT=setTimeout(doSave,700);
}
async function doSave(){
  saveT=null;
  if(saving){again=true;return;} saving=true;
  try{await store.save(sk);saving=false;setStatus(savedText());}
  catch(e){saving=false;setStatus(e&&e.code==='quota_exceeded'?'אין מקום לשמירה: מחק סקיצות ישנות':'השמירה נכשלה, ננסה שוב בשינוי הבא');}
  if(again){again=false;doSave();}
}

/* ---------- Google account (Firebase) ---------- */
const cloud={fb:null,auth:null,fs:null,user:null,failed:false,
  configured(){const c=window.SIRTUTI_FIREBASE;return !!(c&&c.apiKey)&&!IS_TAURI&&!window.claude;},
  async init(){
    if(!this.configured()) return;
    $('#acctBtn').hidden=false;
    try{
      const fb=await import('./vendor/firebase.js'); this.fb=fb;
      const app=fb.initializeApp(window.SIRTUTI_FIREBASE);
      this.auth=fb.getAuth(app);
      try{this.fs=fb.initializeFirestore(app,{localCache:fb.persistentLocalCache({tabManager:fb.persistentMultipleTabManager()})});}
      catch(e){this.fs=fb.initializeFirestore(app,{});}
      fb.getRedirectResult(this.auth).catch(e=>toast(authErr(e)));
      fb.onAuthStateChanged(this.auth,u=>this.onUser(u));
    }catch(e){ this.failed=true; console.warn('Firebase unavailable',e); }
  },
  col(uid){return this.fb.collection(this.fs,'users',uid,'sketches');},
  async onUser(u){
    this.user=u; updAcct();
    if(!u){ if(store.mode==='firebase'){store.remote=null;syncSt='';if(!sk.example)setStatus(savedText());} return; }
    const fb=this.fb,id=u.uid,col=()=>this.col(id);
    const r={kind:'firebase',uid:id,
      list:async()=>{let snap,fromServer=true;
        try{snap=await fb.getDocsFromServer(col());}catch(e){snap=await fb.getDocs(col());fromServer=false;}
        return {docs:snap.docs.map(d=>({id:d.id,...d.data()})),fromServer};},
      save:(sid,body)=>fb.setDoc(fb.doc(col(),sid),body),
      remove:sid=>fb.deleteDoc(fb.doc(col(),sid))};
    store.remote=r;
    // upload sketches that so far exist only on this device
    try{
      const {docs}=await r.list(),cm={}; docs.forEach(d=>cm[d.id]=d);
      Object.values(local.all()).forEach(s=>{ if(s.cloud===id) return; const c=cm[s.id];
        if(!c||(c.updated||0)<(s.updated||0)) pushCloud(r,s.id,plain(s)); });
    }catch(e){}
    const list=(await store.list()).filter(x=>!isProj(x));
    if(sk.example&&undoS.length===0&&list.length) openSketch(clone(list[0]));
    else if(!sk.example){ store.save(sk); setStatus(savedText()); }
  },
  async signIn(){
    if(!this.fb){toast('אין חיבור ל-Google כרגע');return;}
    const p=new this.fb.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
    try{ await this.fb.signInWithPopup(this.auth,p); closeModal(); toast('מחובר. הסקיצות יישמרו בחשבון Google'); }
    catch(e){
      const c=(e&&e.code)||'';
      if(/popup-blocked|operation-not-supported/.test(c)) return this.fb.signInWithRedirect(this.auth,p);
      if(/popup-closed|cancelled-popup/.test(c)) return;
      toast(authErr(e));
    }
  },
  async signOut(){ await this.fb.signOut(this.auth); closeModal(); toast('התנתקת. הסקיצות נשארות גם במכשיר הזה'); }
};
function authErr(e){
  const c=(e&&e.code)||'';
  if(c.includes('unauthorized-domain')) return 'הכתובת הזו לא מאושרת ב-Firebase (Authorized domains)';
  if(c.includes('network')) return 'אין חיבור לאינטרנט';
  return 'ההתחברות נכשלה';
}
function updAcct(){
  const b=$('#acctBtn'),u=cloud.user; b.classList.toggle('on',!!u);

/* ---------- history ---------- */
function snap(){return JSON.stringify(sk.shapes);}
function commit(){
  const j=snap(); if(j===lastJSON) return;
  undoS.push(lastJSON); if(undoS.length>80) undoS.shift(); redoS=[]; lastJSON=j;
  scheduleSave(); updHist();
}
function resetHist(){undoS=[];redoS=[];lastJSON=snap();updHist();}
function updHist(){$('#undoBtn').disabled=!undoS.length;$('#redoBtn').disabled=!redoS.length;}
function undo(){ if(!undoS.length) return; redoS.push(lastJSON); lastJSON=undoS.pop(); sk.shapes=JSON.parse(lastJSON); afterHist(); }
function redo(){ if(!redoS.length) return; undoS.push(lastJSON); lastJSON=redoS.pop(); sk.shapes=JSON.parse(lastJSON); afterHist(); }
function afterHist(){ if(!cur()) sel=null; scheduleSave(); updHist(); openPanel(); render(); }

/* ---------- render ---------- */
function render(){
  const r=svg.getBoundingClientRect(); W=r.width; H=r.height;
  let bodies='',labs='';
  sk.shapes.forEach(s=>{const o=shapeSVG(s,view,{fs:12.5});bodies+=o.body;labs+=o.lab;});
  const s=cur();
  svg.innerHTML=gridSVG(view,W,H)+bodies+labs+(s?selSVG(s,view):'')+drawOverlay();
  let tot=0; sk.shapes.forEach(x=>{if(x.include!==false&&!isOpen(x)){tot+=measures(x,geom(x)).area;}});
  $('#totalA').textContent=fmt(tot);
  $('#empty').hidden=sk.shapes.length>0;
  const L=[0.25,0.5,1,2,5,10,20,50,100,200].find(v=>v*view.k>=50)||500;
  $('#scalebar i').style.width=(L*view.k)+'px'; $('#scalebar span').textContent=(L<1?L.toFixed(2):L)+' מ׳';
}
function fit(){
  const r=svg.getBoundingClientRect(); W=r.width; H=r.height;
  const avH=(isMobile()&&!sheet.hidden)?H*0.48:H;
  if(!sk.shapes.length){view={k:40,ox:W/2,oy:avH/2};return;}
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  sk.shapes.forEach(s=>geom(s).w.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}));
  const bw=Math.max(x1-x0,0.5),bh=Math.max(y1-y0,0.5);
  const k=Math.max(4,Math.min(400,Math.min((W-70)/bw,(avH-110)/bh)));
  view={k,ox:W/2-(x0+x1)/2*k,oy:avH/2-(y0+y1)/2*k+(avH===H?-10:0)};
}

function updInfo(){

sheet.addEventListener('input',e=>{
  const t=e.target,s=cur(); if(!s) return;
  if(t.id==='f-name'){s.name=t.value;}
  else if(t.dataset.f){
    const f=t.dataset.f,v=num(t.value); if(v===null) return;
    if(f==='rot') s.rot=normRot(v);
    else if(f==='n'){ if(v<3||v>12) return; s.p.n=Math.round(v); }
    else if(f==='o') s.p.o=v;
    else { if(v<=0) return; s.p[f]=v; }
  }else if(t.dataset.seg!=null){
    const i=+t.dataset.seg,k=t.dataset.k,v=num(t.value); if(v===null) return;
    if(k==='len'&&v<=0) return; if(k==='ang'&&(v<=0||v>=360)) return;
    s.p.segs[i][k]=v;
  }else return;
  render(); updInfo();
});
sheet.addEventListener('change',e=>{
  const t=e.target,s=cur(); if(!s) return;
  if(t.id==='t-closed'){
    if(!t.checked){ // closed -> open: keep the shape by turning the closing side into a real side
      let x=0,y=0,hd=0,last=0; s.p.segs.forEach(g=>{x+=g.len*Math.cos(hd);y+=g.len*Math.sin(hd);last=hd;hd+=(180-g.ang)*Math.PI/180;});
      const cl=Math.hypot(x,y);
      if(cl>0.01){ let tr=(Math.atan2(-y,-x)-last)*180/Math.PI; tr=((tr+180)%360+360)%360-180;

/* ---------- hand drawing ---------- */
const toW=p=>[(p.x-view.ox)/view.k,(p.y-view.oy)/view.k];
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;if(L2<1e-12)return dist(p,a);
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function rdp(P,eps){
  if(P.length<3) return P.slice(); let dm=0,ix=0; const a=P[0],b=P[P.length-1];
  for(let i=1;i<P.length-1;i++){const d=segDist(P[i],a,b);if(d>dm){dm=d;ix=i;}}
  if(dm>eps){const l=rdp(P.slice(0,ix+1),eps),r=rdp(P.slice(ix),eps);return l.slice(0,-1).concat(r);}
  return [a,b];
}
// snap side directions to 15° steps, merge straight runs, and (for closed shapes) nudge lengths so the outline closes cleanly
function straighten(P,closed){
  const step=Math.PI/12,n=P.length,m=closed?n:n-1,minL=12/view.k;
  let sides=[];
  for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%n],L=dist(a,b);if(L<minL)continue;
    sides.push({h:Math.round(Math.atan2(b[1]-a[1],b[0]-a[0])/step),L});}
  const same=(x,y)=>((x.h-y.h)%24+24)%24===0;
  const merged=[];sides.forEach(sd=>{const l=merged[merged.length-1];if(l&&same(l,sd))l.L+=sd.L;else merged.push({...sd});});
  if(closed) while(merged.length>1&&same(merged[0],merged[merged.length-1])){merged[0].L+=merged.pop().L;}
  sides=merged; if(sides.length<(closed?3:1)) return null;
  const hs=sides.map(sd=>sd.h*step);
  if(closed){
    let a=0,b=0,c=0,rx=0,ry=0;
    sides.forEach((sd,i)=>{const cs=Math.cos(hs[i]),sn=Math.sin(hs[i]);a+=cs*cs;b+=cs*sn;c+=sn*sn;rx+=cs*sd.L;ry+=sn*sd.L;});
    const det=a*c-b*b;
    if(Math.abs(det)>1e-9){const lx=(c*rx-b*ry)/det,ly=(a*ry-b*rx)/det;
      const nl=sides.map((sd,i)=>sd.L-(Math.cos(hs[i])*lx+Math.sin(hs[i])*ly));
      if(nl.every((v,i)=>v>sides[i].L*0.4)) nl.forEach((v,i)=>sides[i].L=v);}
  }
  sides.forEach(sd=>sd.L=Math.max(0.05,Math.round(sd.L*20)/20));
  const out=[[0,0]],cnt=closed?sides.length-1:sides.length;
  for(let i=0;i<cnt;i++){const l=out[out.length-1];out.push([l[0]+sides[i].L*Math.cos(hs[i]),l[1]+sides[i].L*Math.sin(hs[i])]);}
  const bb=Q=>{let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;Q.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});return [(x0+x1)/2,(y0+y1)/2];};
  const c0=bb(P),c1=bb(out);
  return out.map(([x,y])=>[x+c0[0]-c1[0],y+c0[1]-c1[1]]);
}
function polyToShape(P,closed){
  let pts=P.map(p=>p.slice()); if(closed&&sarea(pts)<0) pts.reverse();
  const n=pts.length,hs=[],segs=[];
  for(let i=0;i<n-1;i++) hs.push(Math.atan2(pts[i+1][1]-pts[i][1],pts[i+1][0]-pts[i][0]));
  for(let i=0;i<n-1;i++){
    let ang=90; if(i<n-2){let t=(hs[i+1]-hs[i])*180/Math.PI;t=((t+180)%360+360)%360-180;ang=Math.round((180-t)*10)/10;}
    segs.push({len:Math.round(dist(pts[i],pts[i+1])*100)/100,ang});
  }
  const cnt=sk.shapes.filter(x=>x.kind==='free'&&!!x.p.open===!closed).length+1;
  const s={id:uid(),kind:'free',name:closed?'שרטוט '+cnt:'',p:{segs,open:!closed},x:0,y:0,rot:normRot(hs[0]*180/Math.PI),color:PALETTE[sk.shapes.length%PALETTE.length]};
  const g=geom(s); s.x=Math.round((pts[0][0]-g.w[0][0])*1000)/1000; s.y=Math.round((pts[0][1]-g.w[0][1])*1000)/1000;
  return s;
}
function snapCand(w){
  const L=draw.pts[draw.pts.length-1],thr=14/view.k;
  if(draw.pts.length>=3&&dist(w,draw.pts[0])<thr*1.5) return {pt:draw.pts[0].slice(),start:true};
  if(magnet){let best=null,bd=thr;sk.shapes.forEach(s=>snapPts(s).forEach(q=>{const d=dist(w,q);if(d<bd){bd=d;best=q;}}));
    if(best) return {pt:best.slice()};}
  if(L&&magnet){let d=dist(L,w),a=Math.atan2(w[1]-L[1],w[0]-L[0]);a=Math.round(a/(Math.PI/12))*(Math.PI/12);d=Math.round(d*20)/20;
    return {pt:[L[0]+d*Math.cos(a),L[1]+d*Math.sin(a)]};}

}
function drawOverlay(){
  if(!draw) return '';
  const S=w=>[w[0]*view.k+view.ox,w[1]*view.k+view.oy],J=Q=>Q.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  if(draw.stroke) return `<polyline class="dstroke" points="${J(draw.stroke.map(S))}"/>`;
  const P=draw.pts.map(S); let o='';
  const lab=(a,b,L)=>{const x=(a[0]+b[0])/2,y=(a[1]+b[1])/2-12;return `<text class="ca" x="${x}" y="${y}" font-size="13" text-anchor="middle" stroke-width="4">${fmt(L)}</text>`;};
  if(P.length>1) o+=`<polyline class="dline" points="${J(P)}"/>`;
  for(let i=0;i<P.length-1;i++) o+=lab(P[i],P[i+1],dist(draw.pts[i],draw.pts[i+1]));
  if(draw.prev){const q=S(draw.prev.pt);
    if(P.length){const a=P[P.length-1];o+=`<line class="dprev" x1="${a[0]}" y1="${a[1]}" x2="${q[0]}" y2="${q[1]}"/>`+lab(a,q,dist(draw.pts[draw.pts.length-1],draw.prev.pt));}
    o+=`<circle class="dcur" cx="${q[0]}" cy="${q[1]}" r="${draw.prev.start?13:7}"/>`;}
  P.forEach((p,i)=>{const st=i===0&&P.length>=3;o+=`<circle class="${st?'dstart':'dvtx'}" cx="${p[0]}" cy="${p[1]}" r="${st?9:4.5}"/>`;});
  return o;
}
function updDrawBar(){
  $('#drawbar').hidden=!draw; svg.classList.toggle('drawing',!!draw);
  if(!draw) return;
  $('#addGroup').hidden=true;
  $('#dmPts').classList.toggle('on',draw.mode==='pts'); $('#dmFree').classList.toggle('on',draw.mode==='free');
  $('#dUndo').hidden=$('#dDone').hidden=draw.mode!=='pts';
  $('#dUndo').disabled=!draw.pts.length; $('#dDone').disabled=draw.pts.length<2;
  $('#dhint').textContent=draw.mode==='pts'
    ?(draw.pts.length<3?'גע בלוח כדי לסמן נקודות. אפשר לגרור לפני שמרימים את האצבע.':'לסגירת הצורה גע בנקודת ההתחלה (העיגול הגדול). „סיום" משאיר קו פתוח בנקודה האחרונה.')
    :'צייר עם האצבע. אם תסיים ליד נקודת ההתחלה הצורה תיסגר. הקווים מתיישרים אוטומטית.';
}
function startDraw(){ select(null); draw={mode:drawMode,pts:[],prev:null,stroke:null}; updDrawBar(); render(); }
function endDraw(){ draw=null; updDrawBar(); $('#addGroup').hidden=false; render(); }
function finishDraw(closed,P){
  P=P||draw.pts;
  if(P.length<(closed?3:2)){toast(closed?'צורה סגורה צריכה לפחות 3 נקודות':'צריך לפחות 2 נקודות');return;}
  const s=polyToShape(P,closed); sk.shapes.push(s); commit(); endDraw(); select(s.id);
  toast('אפשר עכשיו לתקן את אורך כל צלע בחלונית');
}
function drawDown(p){
  if(draw.mode==='free'){draw.stroke=[toW(p)];}
  else draw.prev=snapCand(toW(p));
  act={type:'drawing'}; render();
}
function drawMove(p){
  if(draw.mode==='free'&&draw.stroke){const w=toW(p),l=draw.stroke[draw.stroke.length-1];if(dist(w,l)*view.k>2){draw.stroke.push(w);render();}}
  else if(draw.mode==='pts'){draw.prev=snapCand(toW(p));render();}
}
function drawUp(p){
  if(draw.mode==='free'){
    let P=draw.stroke; draw.stroke=null; if(!P||P.length<2){render();return;}
    P=rdp(P,8/view.k); let closed=false;
    if(P.length>=4&&dist(P[0],P[P.length-1])*view.k<40){closed=true;P.pop();}
    if(magnet){const Q=straighten(P,closed); if(Q) P=Q;}
    if(P.length<(closed?3:2)||(!closed&&dist(P[0],P[P.length-1])*view.k<10)){toast('הקו קצר מדי, נסה שוב');render();return;}
    finishDraw(closed,P); return;
  }
  const c=snapCand(toW(p)); draw.prev=null;
  if(c.start){finishDraw(true);return;}
  const l=draw.pts[draw.pts.length-1];
  if(!l||dist(l,c.pt)*view.k>=8) draw.pts.push(c.pt);
  updDrawBar(); render();
}

$('#dmPts').onclick=()=>{drawMode='pts';draw.mode='pts';draw.stroke=null;updDrawBar();render();};

function showPicker(){

function addShape(kind){

/* ---------- pointer interaction ---------- */
const ptrs=new Map(); let act=null;
function spt(e){const r=svg.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function snapPts(s){const g=geom(s);return g.circle?[[s.x-g.circle,s.y],[s.x+g.circle,s.y],[s.x,s.y-g.circle],[s.x,s.y+g.circle]]:g.w;}
svg.addEventListener('pointerdown',e=>{
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  const p=spt(e); ptrs.set(e.pointerId,p);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    if(act&&act.moved&&(act.type==='drag'||act.type==='rot')) commit();
    if(draw){draw.prev=null;draw.stroke=null;}
    act={type:'pinch',d0:Math.hypot(b.x-a.x,b.y-a.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...view}};
    return;
  }
  if(ptrs.size>2) return;
  if(draw){drawDown(p);return;}
  const rt=e.target.closest&&e.target.closest('[data-rot]'),sh=e.target.closest&&e.target.closest('[data-id]');
  if(rt&&cur()){ act={type:'rot',moved:false}; }
  else if(sh){
    const s=sk.shapes.find(x=>x.id===sh.dataset.id); if(!s) return;
    if(sel!==s.id) select(s.id);
    const rel=snapPts(s).map(([x,y])=>[x-s.x,y-s.y]);
    const others=[]; sk.shapes.forEach(o=>{if(o!==s) snapPts(o).forEach(q=>others.push(q));});
    act={type:'drag',s,sx:p.x,sy:p.y,x0:s.x,y0:s.y,rel,others,moved:false};
  }else act={type:'pan',sx:p.x,sy:p.y,ox:view.ox,oy:view.oy,moved:false};
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; const p=spt(e); ptrs.set(e.pointerId,p);
  if(!act) return;
  if(act.type==='pinch'&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(b.x-a.x,b.y-a.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const k=Math.max(3,Math.min(600,act.v0.k*d/act.d0));
    const wx=(act.m0.x-act.v0.ox)/act.v0.k,wy=(act.m0.y-act.v0.oy)/act.v0.k;
    view={k,ox:m.x-wx*k,oy:m.y-wy*k}; render(); return;
  }
  if(act.type==='drawing'){ if(draw) drawMove(p); return; }
  if(act.type==='pan'){
    if(!act.moved&&Math.hypot(p.x-act.sx,p.y-act.sy)<5) return; act.moved=true;
    view.ox=act.ox+p.x-act.sx; view.oy=act.oy+p.y-act.sy; render();
  }else if(act.type==='drag'){
    if(!act.moved&&Math.hypot(p.x-act.sx,p.y-act.sy)<3) return; act.moved=true;
    let nx=act.x0+(p.x-act.sx)/view.k, ny=act.y0+(p.y-act.sy)/view.k;
    if(magnet){
      const thr=11/view.k; let bx=thr,by=thr,ax=0,ay=0;
      act.rel.forEach(([rx,ry])=>{const vx=nx+rx,vy=ny+ry; act.others.forEach(([qx,qy])=>{const dx=qx-vx,dy=qy-vy; if(Math.abs(dx)<Math.abs(bx)){bx=dx;ax=dx;} if(Math.abs(dy)<Math.abs(by)){by=dy;ay=dy;}});});
      nx+=ax; ny+=ay;
    }
    act.s.x=Math.round(nx*1000)/1000; act.s.y=Math.round(ny*1000)/1000; render();
  }else if(act.type==='rot'){
    const s=cur(); if(!s) return; act.moved=true;
    const cx=s.x*view.k+view.ox,cy=s.y*view.k+view.oy;
    let a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;
    a=magnet?Math.round(a/15)*15:Math.round(a);

  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(!act) return;
  if(act.type==='pinch'){ if(ptrs.size===0) act=null; else act={type:'none'}; return; }
  if(ptrs.size>0) return;
  if(act.type==='drawing'){ act=null; if(!draw) return;
    if(e.type==='pointerup') drawUp(spt(e)); else {draw.prev=null;draw.stroke=null;render();}
    return; }
  if((act.type==='drag'||act.type==='rot')&&act.moved) commit();
  if(act.type==='pan'&&!act.moved&&e.type==='pointerup'&&sel) select(null);
  act=null;
}
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=spt(e);zoomAt(p,Math.exp(-e.deltaY*0.0016));},{passive:false});
function zoomAt(p,f){const k=Math.max(3,Math.min(600,view.k*f)),wx=(p.x-view.ox)/view.k,wy=(p.y-view.oy)/view.k;view={k,ox:p.x-wx*k,oy:p.y-wy*k};render();}

/* ---------- summary ---------- */
function rowsData(sx=sk){
  return sx.shapes.filter(s=>!isOpen(s)).map(s=>{const m=measures(s,geom(s));return {name:s.name||SHORT[s.kind],kind:SHORT[s.kind],area:m.area,per:m.per,inc:s.include!==false};});
}
$('#totalBtn').onclick=()=>{
  const rows=rowsData(),tot=rows.filter(r=>r.inc).reduce((t,r)=>t+r.area,0);
  if(!rows.length){toast('אין עדיין צורות בשרטוט');return;}
  modal(`<h2>סיכום שטחים<button class="ib" data-close aria-label="סגירה">${ic('x')}</button></h2><div class="tbl"><table><thead><tr><th>שם</th><th>צורה</th><th class="n">שטח (מ״ר)</th><th class="n">היקף (מ׳)</th></tr></thead><tbody>`+

/* ---------- export ---------- */
function exportSVG(sx=sk,o={}){
  const hd=o.header!==false,tb=o.table!==false,ft=o.foot!==false;
  const efs=o.fs||21;
  if(!sx.shapes.length) return null;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  sx.shapes.forEach(s=>geom(s).w.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}));
  const Wd=1400,pad=70,head=hd?130:10,bw=Math.max(x1-x0,.5),bh=Math.max(y1-y0,.5);
  const k=Math.min((Wd-2*pad)/bw,1000/bh),dh=bh*k+2*pad;
  const rows=rowsData(sx),tot=rows.filter(r=>r.inc).reduce((t,r)=>t+r.area,0);
  const tH=tb&&rows.length?90+(rows.length+1)*42:0, Hd=Math.round(head+dh+tH+(ft?60:10));
  const T={k,ox:pad+((Wd-2*pad)-bw*k)/2-x0*k,oy:head+pad-y0*k};
  let b='',l='';sx.shapes.forEach(s=>{const o=shapeSVG(s,T,{fs:efs,exp:true});b+=o.body;l+=o.lab;});
  const R=Wd-pad;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" width="${Wd}" height="${Hd}" viewBox="0 0 ${Wd} ${Hd}"><style>
  text{font-family:Rubik,Arial,"Noto Sans Hebrew",sans-serif}
  .el{fill:#1c232d;stroke:#fff;paint-order:stroke;font-weight:500}.cn{fill:#1c232d;stroke:#fff;paint-order:stroke;font-weight:700}
  .ca{fill:#b44612;stroke:#fff;paint-order:stroke;font-weight:700}.cp{fill:#5d6774;stroke:#fff;paint-order:stroke}
  .h1{font-size:40px;font-weight:700;fill:#1c232d}.h2{font-size:20px;fill:#5d6774}.th{font-size:19px;fill:#5d6774}.td{font-size:21px;fill:#1c232d}.tb{font-size:22px;font-weight:700;fill:#1c232d}
  </style><rect width="100%" height="100%" fill="#ffffff"/>
`+(hd?`<text class="h1" x="${R}" y="62" direction="rtl" text-anchor="start">${esc(sx.name||'סקיצה')}</text>
  <text class="h2" x="${R}" y="100" direction="rtl" text-anchor="start">${dateStr(Date.now())} · מידות במטרים · סה״כ שטח ${fmt(tot)} מ״ר</text>
  <line x1="${pad}" y1="${head-8}" x2="${R}" y2="${head-8}" stroke="#d8dcd3" stroke-width="2"/>`:'')+b+l;
  if(tb&&rows.length){
    let y=head+dh+40; const cols=[R,R-460,R-760,R-1010];
    g+=`<line x1="${pad}" y1="${y-30}" x2="${R}" y2="${y-30}" stroke="#d8dcd3" stroke-width="2"/>`;
    ['שם','צורה','שטח (מ״ר)','היקף (מ׳)'].forEach((t,i)=>g+=`<text class="th" x="${cols[i]}" y="${y}" direction="rtl" text-anchor="start">${t}</text>`);
    rows.forEach(r=>{y+=42;g+=`<text class="td" x="${cols[0]}" y="${y}" direction="rtl" text-anchor="start"${r.inc?'':' fill-opacity=".55"'}>${esc(r.name)}${r.inc?'':' (לא נספר)'}</text><text class="td" x="${cols[1]}" y="${y}" direction="rtl" text-anchor="start">${r.kind}</text><text class="td" x="${cols[2]}" y="${y}" direction="rtl" text-anchor="start">${fmt(r.area)}</text><text class="td" x="${cols[3]}" y="${y}" direction="rtl" text-anchor="start">${fmt(r.per)}</text>`;});
    y+=46; g+=`<line x1="${pad}" y1="${y-32}" x2="${R}" y2="${y-32}" stroke="#1c232d" stroke-width="1.5"/><text class="tb" x="${cols[0]}" y="${y}" direction="rtl" text-anchor="start">סה״כ</text><text class="tb" x="${cols[2]}" y="${y}" direction="rtl" text-anchor="start">${fmt(tot)}</text>`;
  }
  if(ft) g+=`<text class="h2" x="${R}" y="${Hd-24}" direction="rtl" text-anchor="start" font-size="16">סקיצה להערכה בלבד, אינה מדידה מדויקת</text>`;
  g+='</svg>';
  return {svg:g,w:Wd,h:Hd};
}
const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
// Save a generated file: desktop app → native save dialog; browser → normal download; Claude → downloads capability.
async function saveFile(name,data,ext,label){
  const T=window.__TAURI__;
  if(IS_TAURI&&T&&T.dialog&&T.fs){
    const path=await T.dialog.save({defaultPath:name,filters:[{name:label,extensions:[ext]}]});
    if(!path) return 'cancel';
    if(typeof data==='string') await T.fs.writeTextFile(path,data);
    else await T.fs.writeFile(path,new Uint8Array(await data.arrayBuffer()));
    return 'saved';
  }
  if(window.claude){
    const dl=await dlP; if(!dl) return 'fallback';
    try{ await dl.save({filename:name,data}); return 'saved'; }catch(e){ return e&&e.code==='declined'?'cancel':'fallback'; }
  }
  const blob=typeof data==='string'?new Blob([data],{type:'application/json'}):data;
  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
  return 'saved';
}
async function backupOut(list){
  if(!list.length){toast('אין סקיצות לגיבוי');return;}
  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const json=JSON.stringify({app:'sirtuti',format:1,exported:d.toISOString(),sketches:list.map(s=>({id:s.id,...plain(s)}))},null,1);
  try{ const r=await saveFile('sirtuti-backup-'+ds+'.json',json,'json','גיבוי שרטוטי');
    if(r==='saved') toast('נשמר גיבוי של '+list.length+' סקיצות'); else if(r==='fallback') toast('שמירת קבצים לא זמינה כאן'); }
  catch(e){ toast('שמירת הגיבוי נכשלה'); }
}
async function backupIn(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('הקובץ לא נקרא: זה לא קובץ גיבוי של שרטוטי'); return; }
  const arr=Array.isArray(data&&data.sketches)?data.sketches:null;
  if(!arr){ toast('הקובץ לא נקרא: זה לא קובץ גיבוי של שרטוטי'); return; }
  const have=local.all(); let n=0;
  for(const s of arr){
    if(!s||!Array.isArray(s.shapes)) continue;
    const id=s.id||('s'+uid()),cur=have[id];
    if(cur&&(cur.updated||0)>=(s.updated||0)) continue;
    await store.save({id,...plain(s)}); n++;
  }
  toast(n?('יובאו '+n+' סקיצות'):'כל הסקיצות בקובץ כבר קיימות'); showList();
}
$('#expBtn').onclick=async()=>{
  const ex=exportSVG(); if(!ex){toast('אין צורות לשמירה');return;}
  toast('מכין תמונה…');
  try{
    const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ex.svg);
    await img.decode();
    const c=document.createElement('canvas'); c.width=ex.w*2; c.height=ex.h*2;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const fname=((sk.name||'סקיצה').replace(/[\\/:*?"<>|]+/g,' ').trim()||'סקיצה')+'.png';
    const r=await saveFile(fname,blob,'png','תמונה');
    if(r==='saved'){ toast('התמונה נשמרה'); return; }
    if(r==='cancel'){ $('#toast').hidden=true; return; }
    const url=URL.createObjectURL(blob);
    modal(`<h2>הסקיצה כתמונה<button class="ib" data-close aria-label="סגירה">${ic('x')}</button></h2><img class="expimg" src="${url}" alt="סקיצה"><div class="hint">בטלפון: לחיצה ארוכה על התמונה ← שמירה או שיתוף. במחשב: קליק ימני ← שמירת תמונה.</div>`);
  }catch(e){ toast('יצירת התמונה נכשלה'); }
};

/* ---------- project documents ---------- */
// A project is stored like a sketch (same store, sync, folder, backup) with kind:'project'.
// blocks: {t:'h'|'p'|'todo'|'sk'|'areas', v?:text, done?:bool, id?:sketchId}
const docv=$('#docv'),dpage=$('#dpage');
let doc=null,docSaveT=null,curBlk=-1,docReturn=null;
const VIEW_K='sirtuti.view';
const setView=v=>{try{v?localStorage.setItem(VIEW_K,v):localStorage.removeItem(VIEW_K)}catch(e){}};
const getView=()=>{try{return localStorage.getItem(VIEW_K)||''}catch(e){return ''}};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d&&m&&y?`${+d}.${+m}.${y}`:iso;};
function newProject(){
  return {id:'p'+uid(),kind:'project',name:'פרויקט חדש',meta:{client:'',address:'',date:todayISO()},
    blocks:[{t:'h',v:'סיכום ביקור'},{t:'p',v:''}],shapes:[],updated:Date.now()};
}
const skById=id=>{const s=local.all()[id];return s&&!isProj(s)?s:(sk&&sk.id===id?sk:null);};
const skArea=s=>rowsData(s).filter(r=>r.inc).reduce((t,r)=>t+r.area,0);
function docSketchIds(){const seen=new Set(),out=[];(doc.blocks||[]).forEach(b=>{if(b.t==='sk'&&b.id&&!seen.has(b.id)){seen.add(b.id);out.push(b.id);}});return out;}
function areasData(){
  const groups=docSketchIds().map(id=>{const s=skById(id);if(!s)return null;const rows=rowsData(s).filter(r=>r.inc);
    return {name:s.name||'סקיצה',rows,total:rows.reduce((t,r)=>t+r.area,0)};}).filter(Boolean);
  return {groups,total:groups.reduce((t,g)=>t+g.total,0)};
}
function previewSrc(s){const ex=exportSVG(s,{header:false,table:false,foot:false,fs:28});return ex?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ex.svg):'';}

function blockHTML(b,i){
  const ctl=`<div class="bctl"><button data-mv="-1" aria-label="למעלה">${ic('up')}</button><button data-mv="1" aria-label="למטה">${ic('down')}</button><button data-rm aria-label="מחיקה">${ic('x')}</button></div>`;
  let c='';
  switch(b.t){
    case 'h': c=`<input class="bh" id="b${i}" data-f="v" value="${esc(b.v)}" placeholder="כותרת">`; break;
    case 'p': c=`<textarea class="bp" id="b${i}" data-f="v" rows="1" placeholder="כתוב כאן… (שורה שמתחילה ב- „-" תהיה רשימה)">${esc(b.v)}</textarea>`; break;
    case 'todo': c=`<div class="btodo"><input type="checkbox" id="c${i}" data-f="done" ${b.done?'checked':''} aria-label="בוצע"><input class="bt${b.done?' done':''}" id="b${i}" data-f="v" value="${esc(b.v)}" placeholder="משימה"></div>`; break;
    case 'sk': { const s=skById(b.id);
      c=s?`<button class="bsk" data-edit="${esc(b.id)}"><img alt="${esc(s.name)}" src="${previewSrc(s)}"><span class="cap"><b>${esc(s.name||'סקיצה')}</b><span>${fmt(skArea(s))} מ״ר</span><span class="ed">${ic('pen')} עריכת הסקיצה</span></span></button>`
        :`<div class="bmiss">הסקיצה נמחקה</div>`; break; }
    case 'areas': { const a=areasData();
      c=`<div class="bareas"><div class="bat">סיכום שטחים</div>`+(a.groups.length?`<div class="tbl"><table><thead><tr><th>פריט</th><th class="n">שטח (מ״ר)</th></tr></thead><tbody>`+
        a.groups.map(g=>`<tr class="grp"><td colspan="2">${esc(g.name)}</td></tr>`+g.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${fmt(r.area)}</td></tr>`).join('')+
          (a.groups.length>1?`<tr class="sub"><td>סה״כ</td><td class="n">${fmt(g.total)}</td></tr>`:'')).join('')+
        `</tbody><tfoot><tr><td>סה״כ${a.groups.length>1?' בפרויקט':''}</td><td class="n">${fmt(a.total)}</td></tr></tfoot></table></div>`
        :`<div class="hint">הטבלה תתמלא אוטומטית מהסקיצות שבמסמך.</div>`)+`</div>`; break; }
  }
  return `<div class="blk blk-${b.t}" data-i="${i}">${c}${ctl}</div>`;
}

function autoGrow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function docStatus(t){$('#docStatus').textContent=t;}
function scheduleDocSave(){ docStatus('שומר…'); clearTimeout(docSaveT); docSaveT=setTimeout(saveDocNow,600); }
async function saveDocNow(){

  doc.updated=Date.now();
  try{ await store.save(doc); docStatus(savedText()); }catch(e){ docStatus('השמירה נכשלה'); }
}
function insertBlock(b,after){
  const i=(after!=null&&after>=0&&after<doc.blocks.length)?after+1:doc.blocks.length;
  doc.blocks.splice(i,0,b); curBlk=i; scheduleDocSave(); renderDoc(['h','p','todo'].includes(b.t)?i:null); return i;
}
function openDoc(p){
  doc=clone(p); doc.blocks=doc.blocks||[]; curBlk=-1; docReturn=null; $('#backDoc').hidden=true;
  renderDoc(); docStatus(savedText()); docv.hidden=false; setView(doc.id); closeModal();
}
async function closeDoc(){ if(!doc) return; if(docSaveT) await saveDocNow(); docv.hidden=true; doc=null; setView(''); }
async function flushSketch(){ if(saveT){clearTimeout(saveT);saveT=null;await doSave();} else if(saving){await new Promise(r=>setTimeout(r,300));} }
async function editSketchFromDoc(id){
  const s=skById(id); if(!s){toast('הסקיצה לא נמצאה');return;}
  if(docSaveT) await saveDocNow();
  docReturn=doc.id; const title=doc.name||'המסמך';
  docv.hidden=true; setView(''); openSketch(clone(s));
  $('#backDoc').innerHTML=`${ic('up')}<span>חזרה למסמך: ${esc(title)}</span>`; $('#backDoc').hidden=false;
}
$('#backDoc').onclick=async()=>{
  await flushSketch(); const p=local.all()[docReturn]; $('#backDoc').hidden=true;
  if(p) openDoc(p); else docReturn=null;
};
function pickSketchForDoc(after){
  const list=Object.values(local.all()).filter(s=>!isProj(s)&&!s.example).sort((a,b)=>(b.updated||0)-(a.updated||0));
  modal(`<h2>הוספת סקיצה למסמך<button class="ib" data-close aria-label="סגירה">${ic('x')}</button></h2>
    <div class="btnrow" style="margin:0 0 12px"><button class="primary" id="skNewForDoc">${ic('plus')} סקיצה חדשה</button></div>
    ${list.length?`<div class="hint" style="margin-bottom:6px">או בחר סקיצה קיימת:</div><div class="sklist">`+list.map(s=>`<div class="sk"><div class="meta"><b>${esc(s.name||'ללא שם')}</b><small>${dateStr(s.updated||Date.now())} · ${fmt(skArea(s))} מ״ר</small></div><button class="chip" data-pick="${esc(s.id)}">הוספה</button></div>`).join('')+`</div>`:''}`);
  $('#skNewForDoc').onclick=async()=>{
    const n=docSketchIds().length+1,s=newSketch(); s.name=(doc.name||'פרויקט')+' – סקיצה '+n; s.updated=Date.now();
    await store.save(s); insertBlock({t:'sk',id:s.id},after); closeModal(); editSketchFromDoc(s.id);
  };
  modalEl.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{insertBlock({t:'sk',id:b.dataset.pick},after);closeModal();});
}
// editing
dpage.addEventListener('focusin',e=>{const bl=e.target.closest('.blk');if(bl)curBlk=+bl.dataset.i;});
dpage.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.m){ doc.meta[t.dataset.m]=t.value; scheduleDocSave(); return; }
  const bl=t.closest('.blk'); if(!bl) return; const b=doc.blocks[+bl.dataset.i];
  if(t.dataset.f==='v'){ b.v=t.value; if(t.tagName==='TEXTAREA') autoGrow(t); }
  else if(t.dataset.f==='done'){ b.done=t.checked; const x=bl.querySelector('.bt'); if(x) x.classList.toggle('done',b.done); }
  scheduleDocSave();
});
dpage.addEventListener('keydown',e=>{
  const t=e.target,bl=t.closest&&t.closest('.blk'); if(!bl||t.dataset.f!=='v') return;
  const i=+bl.dataset.i,b=doc.blocks[i];
  if(e.key==='Enter'&&(b.t==='todo'||b.t==='h')){ e.preventDefault(); insertBlock(b.t==='todo'?{t:'todo',v:'',done:false}:{t:'p',v:''},i); }
  else if(e.key==='Backspace'&&!t.value&&(b.t==='todo'||b.t==='h'||b.t==='p')&&doc.blocks.length>1){
    e.preventDefault(); doc.blocks.splice(i,1); scheduleDocSave(); renderDoc(i>0?i-1:0); }
});
dpage.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.add){ const t=b.dataset.add;
    if(t==='sk') return pickSketchForDoc(curBlk);
    insertBlock(t==='todo'?{t,v:'',done:false}:t==='areas'?{t}:{t,v:''},curBlk); return; }
  if(b.dataset.edit) return editSketchFromDoc(b.dataset.edit);
  const bl=b.closest('.blk'); if(!bl) return; const i=+bl.dataset.i;
  if(b.dataset.mv){ const j=i+(+b.dataset.mv); if(j<0||j>=doc.blocks.length) return;
    const [x]=doc.blocks.splice(i,1); doc.blocks.splice(j,0,x); curBlk=j; scheduleDocSave(); renderDoc(); return; }
  if(b.dataset.rm!=null){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.innerHTML='למחוק?'; return; }
    doc.blocks.splice(i,1); curBlk=Math.min(i,doc.blocks.length-1); scheduleDocSave(); renderDoc();
  }
});
$('#docTitle').addEventListener('input',e=>{doc.name=e.target.value;scheduleDocSave();});
$('#docBack').onclick=async()=>{ await closeDoc(); render(); };
$('#docList').onclick=()=>showProjects();
$('#docWord').onclick=()=>exportWord();

// projects list (second tab of "My sketches")
function listTabs(active){
  return `<div class="tabs"><button class="${active==='sk'?'on':''}" data-tab="sk">סקיצות</button><button class="${active==='pj'?'on':''}" data-tab="pj">מסמכי פרויקט</button></div>`;
}
modalEl.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return; t.dataset.tab==='pj'?showProjects():showList();});
async function showProjects(){
  modal(`<h2>הסקיצות שלי<button class="ib" data-close aria-label="סגירה">${ic('x')}</button></h2>${listTabs('pj')}<div class="hint">טוען…</div>`);
  const list=(await store.list()).filter(isProj);
  modal(`<h2>הסקיצות שלי<button class="ib" data-close aria-label="סגירה">${ic('x')}</button></h2>${listTabs('pj')}
    ${list.length?`<div class="sklist">`+list.map(p=>{const m=p.meta||{},n=(p.blocks||[]).filter(b=>b.t==='sk').length;
      return `<div class="sk${doc&&doc.id===p.id?' cur':''}"><div class="meta"><b>${esc(p.name||'ללא שם')}</b><small>${[m.client,fmtDate(m.date)].filter(Boolean).map(esc).join(' · ')}${n?` · ${n} סקיצות`:''}</small></div>
      ${doc&&doc.id===p.id?'<small style="color:var(--accent)">פתוח</small>':`<button class="chip" data-openp="${esc(p.id)}">פתיחה</button>`}
      <button class="chip danger" data-delp="${esc(p.id)}" aria-label="מחיקת מסמך">${ic('trash')}</button></div>`;}).join('')+`</div>`
      :`<div class="hint" style="font-size:14.5px">מסמך פרויקט הוא סיכום ביקור בסגנון פתקים: כותבים טקסט, משימות, ומוסיפים סקיצות באמצע. בסוף מייצאים ל-Word.</div>`}
    <div class="btnrow"><button class="primary" id="newProj">${ic('plus')} מסמך פרויקט חדש</button></div>
    <div class="hint">מחיקת מסמך לא מוחקת את הסקיצות שבו.</div>`);
  $('#newProj').onclick=async()=>{ const p=newProject(); await store.save(p); openDoc(p); setTimeout(()=>{const t=$('#docTitle');t.focus();t.select();},50); };
  modalEl.querySelectorAll('[data-openp]').forEach(b=>b.onclick=()=>{const p=list.find(x=>x.id===b.dataset.openp);if(p)openDoc(p);});
  modalEl.querySelectorAll('[data-delp]').forEach(b=>b.onclick=async()=>{
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='למחוק?';return;}
    const id=b.dataset.delp; try{await store.remove(id);}catch(_){toast('המחיקה נכשלה');return;}
    if(doc&&doc.id===id){docv.hidden=true;doc=null;setView('');}
    showProjects();
  });
}

/* ---------- Word export ---------- */
async function svgPng(ex,scale){
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ex.svg); await img.decode();
  const c=document.createElement('canvas'); c.width=Math.round(ex.w*scale); c.height=Math.round(ex.h*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function exportWord(){
  if(!doc) return; await saveDocNow(); toast('מכין קובץ Word…');
  let D; try{ D=await import('./vendor/docx.js'); }catch(e){ toast('ייצוא ל-Word לא זמין כרגע'); return; }
  const {Document,Packer,Paragraph,TextRun,ImageRun,HeadingLevel,Table,TableRow,TableCell,WidthType,BorderStyle,ShadingType}=D;
  const R=(text,o={})=>new TextRun({text:String(text??''),rightToLeft:true,font:'Arial',size:o.size||22,sizeComplexScript:o.size||22,
    bold:!!o.bold,boldComplexScript:!!o.bold,color:o.color,strike:!!o.strike});
  const P=(kids,o={})=>new Paragraph({bidirectional:true,children:[].concat(kids),heading:o.heading,
    spacing:{before:o.before||0,after:o.after??120},indent:o.indent?{start:o.indent}:undefined});
  const out=[],m=doc.meta||{};
  out.push(P(R(doc.name||'פרויקט',{size:40,bold:true,color:'1C232D'}),{after:60,heading:HeadingLevel.TITLE}));
  const metaLine=[m.client&&('לקוח: '+m.client),m.address&&('כתובת: '+m.address),m.date&&('תאריך: '+fmtDate(m.date))].filter(Boolean).join('   ·   ');
  if(metaLine) out.push(P(R(metaLine,{color:'5D6774'}),{after:240}));
  const cell=(t,o={})=>new TableCell({children:[P(R(t,{bold:o.bold,size:20}),{after:0})],width:{size:o.w,type:WidthType.PERCENTAGE},
    shading:o.fill?{type:ShadingType.CLEAR,color:'auto',fill:o.fill}:undefined,margins:{top:60,bottom:60,left:100,right:100}});
  const areasTable=()=>{
    const a=areasData(); if(!a.groups.length) return [P(R('אין עדיין סקיצות במסמך.',{color:'5D6774'}))];
    const multi=a.groups.length>1;
    const rows=[new TableRow({tableHeader:true,children:[cell('פריט',{bold:true,w:70,fill:'E8EBE4'}),cell('שטח (מ״ר)',{bold:true,w:30,fill:'E8EBE4'})]})];
    a.groups.forEach(g=>{
      rows.push(new TableRow({children:[new TableCell({columnSpan:2,children:[P(R(g.name,{bold:true,size:20}),{after:0})],shading:{type:ShadingType.CLEAR,color:'auto',fill:'F3F4F0'},margins:{top:60,bottom:60,left:100,right:100}})]}));
      g.rows.forEach(r=>rows.push(new TableRow({children:[cell(r.name,{w:70}),cell(fmt(r.area),{w:30})]})));
      if(multi) rows.push(new TableRow({children:[cell('סה״כ',{bold:true,w:70}),cell(fmt(g.total),{bold:true,w:30})]}));
    });
    rows.push(new TableRow({children:[cell(multi?'סה״כ בפרויקט':'סה״כ',{bold:true,w:70,fill:'F6E3D8'}),cell(fmt(a.total),{bold:true,w:30,fill:'F6E3D8'})]}));
    const bd={style:BorderStyle.SINGLE,size:4,color:'D8DCD3'};
    return [P(R('סיכום שטחים',{size:26,bold:true}),{before:200}),
      new Table({visuallyRightToLeft:true,width:{size:100,type:WidthType.PERCENTAGE},rows,
        borders:{top:bd,bottom:bd,left:bd,right:bd,insideHorizontal:bd,insideVertical:bd}}),P(R(''))];
  };
  for(const b of doc.blocks){
    if(b.t==='h'&&b.v) out.push(P(R(b.v,{size:28,bold:true,color:'1C232D'}),{before:240,after:100,heading:HeadingLevel.HEADING_2}));
    else if(b.t==='p'){
      String(b.v||'').split('\n').forEach(line=>{
        const li=line.match(/^\s*[-•*]\s+(.*)$/);
        out.push(li?P(R('•  '+li[1]),{indent:360,after:60}):P(R(line)));
      });
    }
    else if(b.t==='todo') out.push(P(R((b.done?'☑  ':'☐  ')+(b.v||''),{strike:false,color:b.done?'5D6774':undefined}),{after:60}));
    else if(b.t==='sk'){
      const s=skById(b.id); if(!s) continue; const ex=exportSVG(s,{header:false,table:false,foot:false,fs:28}); if(!ex) continue;
      const png=await svgPng(ex,1.6),buf=await png.arrayBuffer();
      let w=600,h=Math.round(600*ex.h/ex.w); if(h>720){w=Math.round(w*720/h);h=720;}
      out.push(P(R(s.name||'סקיצה',{size:24,bold:true}),{before:200,after:60}));
      out.push(new Paragraph({children:[new ImageRun({type:'png',data:buf,transformation:{width:w,height:h}})],alignment:'center',spacing:{after:60}}));
      out.push(P(R('סה״כ שטח: '+fmt(skArea(s))+' מ״ר',{color:'5D6774',size:20}),{after:200}));
    }
    else if(b.t==='areas') out.push(...areasTable());
  }
  out.push(P(R('הסקיצות להערכה בלבד ואינן מדידה מדויקת.',{color:'8A939E',size:18}),{before:300}));
  const d=new Document({creator:'Sirtuti',title:doc.name||'פרויקט',
    styles:{default:{document:{run:{font:'Arial'}}}},
    sections:[{properties:{page:{margin:{top:1100,bottom:1100,left:1000,right:1000}}},children:out}]});
  const blob=await Packer.toBlob(d);
  const fname=((doc.name||'פרויקט').replace(/[\\/:*?"<>|]+/g,' ').trim()||'פרויקט')+'.docx';
  try{ const r=await saveFile(fname,blob,'docx','מסמך Word');
    if(r==='saved') toast('קובץ ה-Word נשמר'); else if(r==='cancel') $('#toast').hidden=true; else toast('שמירת קבצים לא זמינה כאן'); }
  catch(e){ toast('שמירת הקובץ נכשלה'); }
}

$('#acctBtn').onclick=showAcct;
if(IS_TAURI) window.addEventListener('focus',async()=>{
  if(!folder.on()||saveT||saving) return;
  try{ await folder.pull(); const cur=local.all()[sk.id];
    if(cur&&(cur.updated||0)>(sk.updated||0)&&undoS.length===0) openSketch(clone(cur)); }catch(e){}
});
store.initClaude().then(async()=>{
  const all=await store.list(),list=all.filter(x=>!isProj(x));
  if(list.length&&sk.example&&undoS.length===0) openSketch(clone(list[0]));
  else if(!sk.example) setStatus(savedText());
  const v=getView(),pv=v&&all.find(x=>x.id===v&&isProj(x)); if(pv) openDoc(pv);
  cloud.init();
});
})();
