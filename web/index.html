<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שרטוטי</title>
<meta name="description" content="שרטוטי – סקיצות עם מידות, שטח והיקף, להצעות מחיר בשטח">
<meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שרטוטי">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: graph-paper board fills the screen; header on top, editing sheet slides up from the bottom on phones and docks to the right on desktop */
:root{
  --paper:#f3f4f0; --board:#fbfbf8; --panel:#ffffff;
  --ink:#1c232d; --ink-2:#5d6774; --line:#d8dcd3;
  --grid:#e8ebe4; --grid-major:#cdd3c8;
  --accent:#c4501a; --accent-ink:#ffffff; --accent-soft:#f6e3d8;
  --danger:#b3261e;
  --font:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --shadow:0 -6px 24px rgba(20,28,38,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181d; --board:#1a1f25; --panel:#20262e;
  --ink:#e8ebef; --ink-2:#9ba5b2; --line:#303842;
  --grid:#222931; --grid-major:#323b46;
  --accent:#f0814a; --accent-ink:#1a1f25; --accent-soft:#3a2a21;
  --danger:#ff7a6e; --shadow:0 -6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14181d; --board:#1a1f25; --panel:#20262e;
  --ink:#e8ebef; --ink-2:#9ba5b2; --line:#303842;
  --grid:#222931; --grid-major:#323b46;
  --accent:#f0814a; --accent-ink:#1a1f25; --accent-soft:#3a2a21;
  --danger:#ff7a6e; --shadow:0 -6px 24px rgba(0,0,0,.45); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* header */
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.titlebox{flex:1;min-width:0;display:flex;flex-direction:column}
.titlebox input{border:0;background:transparent;font-weight:500;font-size:17px;padding:2px 0;min-width:0;width:100%}
.titlebox input:focus{outline:none;border-bottom:1px solid var(--accent)}
.status{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{border:1px solid var(--line);background:var(--board);border-radius:8px;padding:4px 10px;text-align:center;line-height:1.15;flex:none}
.total b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.total small{font-size:11px;color:var(--ink-2)}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--paper)}
.top .ib.on{color:var(--accent);background:var(--accent-soft)}
.acct{display:flex;flex-direction:column;gap:2px;background:var(--paper);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.fold{display:flex;flex-direction:column;gap:4px;background:var(--paper);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.fold b{color:var(--ink);font-size:14.5px}
.fpath{font-size:12.5px;word-break:break-all;text-align:start;color:var(--ink)}
.acct span{color:var(--ink-2);font-size:13.5px;text-align:start}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.icons{display:flex;gap:2px;flex:none}

/* main */
.main{position:relative;display:grid;grid-template-columns:1fr;min-height:0}
.boardwrap{position:relative;min-height:0;min-width:0;background:var(--board)}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#board text{font-family:var(--font);pointer-events:none}
.g-min{stroke:var(--grid);stroke-width:1}
.g-maj{stroke:var(--grid-major);stroke-width:1}
.el{fill:var(--ink);stroke:var(--board);paint-order:stroke;stroke-linejoin:round;font-variant-numeric:tabular-nums;font-weight:500}
.cn{fill:var(--ink);stroke:var(--board);paint-order:stroke;font-weight:700}
.ca{fill:var(--accent);stroke:var(--board);paint-order:stroke;font-weight:700;font-variant-numeric:tabular-nums}
.cp{fill:var(--ink-2);stroke:var(--board);paint-order:stroke;font-variant-numeric:tabular-nums}
.sel{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
.vdot{fill:var(--board);stroke:var(--accent);stroke-width:2;pointer-events:none}
.rh{fill:var(--accent);stroke:var(--board);stroke-width:2;cursor:grab}
.rhl{stroke:var(--accent);stroke-width:1.5}

.hl{stroke:var(--accent);stroke-width:7;stroke-opacity:.4;stroke-linecap:round;pointer-events:none}
.dline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dprev{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.dstroke{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.75}
.dvtx{fill:var(--accent)}
.dstart{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dcur{fill:none;stroke:var(--accent);stroke-width:2}
#board.drawing{cursor:crosshair}
.addg{display:flex;gap:8px;flex-wrap:wrap}
.add.alt{background:var(--panel);color:var(--accent);border:1px solid var(--accent);box-shadow:none}
.drawbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 56px);box-shadow:0 4px 14px rgba(20,28,38,.12)}
.dhint{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.drow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.segctl{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segctl button{border:0;background:var(--board);padding:7px 10px;font-size:14px}
.segctl button.on{background:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.4;cursor:default}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-2);text-align:center;padding:16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.scalebar{position:absolute;top:12px;inset-inline-start:12px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none}
.scalebar i{display:block;height:6px;border:2px solid var(--ink-2);border-top:0}

.dock{position:absolute;bottom:14px;inset-inline:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock > *{pointer-events:auto}
.add{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:500;box-shadow:0 4px 14px rgba(196,80,26,.3)}
.add svg{width:20px;height:20px}
.tools{display:flex;flex-direction:column;gap:6px}
.tools .ib{background:var(--panel);border-color:var(--line)}
.tools .ib.on{color:var(--accent);border-color:var(--accent)}

/* sheet */
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:52%;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-block:6px 18px;padding-inline:16px;z-index:5;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
@media (min-width:900px){
  .main.has-panel{grid-template-columns:340px 1fr}
  .sheet{position:relative;max-height:none;border-radius:0;box-shadow:none;border-inline-end:1px solid var(--line);inset:auto}
  .grab{display:none}
}
.shead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.shead input{flex:1;min-width:0;font-size:17px;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--board)}
.kind{font-size:12px;color:var(--ink-2);margin-bottom:8px;letter-spacing:.02em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld > span{font-size:12.5px;color:var(--ink-2)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--board);overflow:hidden}
.inp input{border:0;background:transparent;padding:9px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums;font-size:16px;text-align:left}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--accent)}
.inp em{font-style:normal;color:var(--ink-2);padding-inline:8px;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.lbl{font-size:12.5px;color:var(--ink-2);min-width:52px}
.chip{border:1px solid var(--line);background:var(--board);border-radius:8px;padding:7px 10px;font-size:14px;display:inline-flex;gap:5px;align-items:center}
.chip svg{width:16px;height:16px}
.chip:hover{border-color:var(--ink-2)}
.chip.danger{color:var(--danger)}
.chip.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.rot .inp{width:96px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.tg{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--accent)}
.info{margin-top:12px;display:flex;gap:16px;background:var(--paper);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.info div{display:flex;flex-direction:column}
.info small{color:var(--ink-2);font-size:12px}
.info b{font-size:17px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.hint{color:var(--ink-2);font-size:12.5px;margin-top:6px;line-height:1.45}
.segs{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:22px 1fr 1fr 32px;gap:6px;align-items:center}
.seg b{font-size:13px;color:var(--ink-2);text-align:center}
.seg .x{border:0;background:transparent;color:var(--ink-2);height:32px}
.seghead{display:grid;grid-template-columns:22px 1fr 1fr 32px;gap:6px;font-size:12px;color:var(--ink-2)}
.closing{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.closing b{color:var(--ink)}

/* picker */
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{border:1px solid var(--line);background:var(--board);border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;text-align:center}
.pick svg{width:40px;height:30px;fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.pick:hover{border-color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 16px}
.card h2{margin:0 0 12px;font-size:18px;text-wrap:balance;display:flex;justify-content:space-between;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font-weight:500;color:var(--ink-2);font-size:12.5px}
td.n,th.n{text-align:end}
tfoot td{font-weight:700;border-bottom:0}
.sklist{display:flex;flex-direction:column;gap:8px}
.sk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sk.cur{border-color:var(--accent)}
.sk .meta{flex:1;min-width:0}
.sk .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk .meta small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:500}
.expimg{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--board);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;pointer-events:none;max-width:90vw;text-align:center}

.dlver{display:flex;flex-direction:column;gap:4px;background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.dlver .new{color:var(--accent);font-weight:500}
.dlnote{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.5}
.dlos{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.dlos.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dlh{display:flex;align-items:center;gap:8px;font-size:15.5px}
.tag{font-size:11.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px}
.dlfile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--board);border-radius:10px;padding:9px 10px;color:var(--ink);text-decoration:none}
.dlfile:hover{border-color:var(--accent)}
.dlfile svg{width:20px;height:20px;color:var(--accent);flex:none}
.dlfile span{display:flex;flex-direction:column;min-width:0}
.dlfile small{color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip{color:var(--ink);text-decoration:none}
.expopts{display:flex;flex-direction:column;gap:8px}
.expopt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--board);border-radius:12px;padding:12px 14px;text-align:start}
.expopt:hover{border-color:var(--accent)}
.expopt svg{width:24px;height:24px;color:var(--accent);flex:none}
.expopt span{display:flex;flex-direction:column;gap:2px}
.expopt small{color:var(--ink-2);font-size:12.5px}
.setg{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.setg .tabs{margin:0}
.setg .tabs button{display:flex;flex-direction:column;align-items:center;gap:1px}
.setg .tabs small{font-size:11.5px;opacity:.8}
/* project document */
.docv{position:fixed;inset:0;z-index:12;background:var(--paper);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.docv .top .chip{flex:none}
.dscroll{overflow:auto;min-height:0;padding-inline:16px;padding-block:18px 120px}
.dpage{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding-block:22px 28px;padding-inline:clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:18px}
.dmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dmeta label{display:flex;flex-direction:column;gap:3px;min-width:0}
.dmeta span{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.dmeta input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;font-size:15.5px;min-width:0;width:100%}
.dmeta input:focus{outline:none;border-bottom-color:var(--accent)}
.blocks{display:flex;flex-direction:column;gap:4px}
.blk{position:relative;border-radius:8px;padding:4px 6px;margin-inline:-6px}
.blk:focus-within,.blk:hover{background:var(--paper)}
.bctl{position:absolute;top:-16px;inset-inline-end:6px;z-index:2;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:0 2px 8px rgba(20,28,38,.12)}
.blk:focus-within .bctl{display:flex}
@media (hover:hover){.blk:hover .bctl{display:flex}}
.bctl button{border:0;background:transparent;color:var(--ink-2);width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:12px}
.bctl button:hover{background:var(--line);color:var(--ink)}
.bctl button.armed{width:auto;padding-inline:8px;background:var(--danger);color:#fff}
.bctl svg{width:16px;height:16px}
.bh,.bp,.bt{border:0;background:transparent;width:100%;min-width:0;font-family:var(--font);color:var(--ink);padding:4px 0}
.bh{font-size:20px;font-weight:700;text-wrap:balance}
.bp{font-size:15.5px;line-height:1.6;resize:none;overflow:hidden;display:block}
.bh:focus,.bp:focus,.bt:focus{outline:none}
.btodo{display:flex;align-items:center;gap:10px}
.btodo input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none;margin:0}
.bt{font-size:15.5px}.bt.done{text-decoration:line-through;color:var(--ink-2)}
.bsk{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;padding:0;width:100%;text-align:start;cursor:pointer}
.bsk:hover{border-color:var(--accent)}
.bsk img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff}
.bsk .cap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:var(--paper);border-top:1px solid var(--line);color:var(--ink);font-size:14px}
.bsk .cap span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bsk .cap .ed{margin-inline-start:auto;color:var(--accent);display:inline-flex;gap:4px;align-items:center}
.bsk .cap svg{width:15px;height:15px}
.bmiss{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--ink-2);text-align:center}
.bareas{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bat{font-weight:700;margin-bottom:6px}
.bareas tr.sub td{font-weight:500;color:var(--ink-2)}
.bareas tr.grp td{font-weight:700;background:var(--paper);border-bottom:0;padding-top:10px}
.addbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:14px;border-top:1px dashed var(--line);color:var(--ink-2);font-size:13px}
.chip.accent{border-color:var(--accent);color:var(--accent)}
.chip svg{width:15px;height:15px}
.backdoc{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;display:inline-flex;gap:6px;align-items:center;max-width:calc(100% - 32px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 14px;font-weight:500;box-shadow:0 4px 14px rgba(196,80,26,.3)}
.backdoc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backdoc svg{width:16px;height:16px;transform:rotate(90deg)}
[dir=ltr] .backdoc svg{transform:rotate(-90deg)}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tabs button{flex:1;border:0;background:var(--board);padding:9px;font-size:14.5px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
@media (max-width:420px){ .top{gap:4px;padding-inline:12px} .ib{width:34px} .total{padding:3px 7px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
@media (min-width:900px){ .sheet{animation:none} }
</style>
</head>
<body>
<div class="app" dir="rtl">
  <header class="top">
    <div class="titlebox">
      <input id="skname" aria-label="שם הסקיצה" value="">
      <span class="status" id="status"></span>
    </div>
    <button class="total" id="totalBtn" title="סיכום שטחים"><b id="totalA">0.00</b><small>מ״ר סה״כ</small></button>
    <div class="icons">
      <button class="ib" id="undoBtn" title="ביטול" aria-label="ביטול"></button>

/* ---------- geometry ---------- */
function localGeom(s){
  const p=s.p; let pts=[],closed=true,err='',circle=null,closeLen=null;
  switch(s.kind){
    case 'rect': pts=[[0,0],[p.w,0],[p.w,p.h],[0,p.h]]; break;

      else{ closeLen=Math.hypot(x,y); if(closeLen<1e-6) pts.pop();
        if(pts.length<3) err=tt("צריך לפחות שתי צלעות."); }
      break; }

  let P=0;for(let i=0;i<g.pts.length;i++)P+=dist(g.pts[i],g.pts[(i+1)%g.pts.length]);

}

}

  }else{

    }
    const lh=1.32; let tot=lines.reduce((t,l)=>t+l[2]*lh,0),y=c[1]-tot/2;
    lines.forEach(([cl,t,f])=>{y+=f*lh/2;lab+=`<text class="${cl}" x="${c[0].toFixed(1)}" y="${y.toFixed(1)}" font-size="${f.toFixed(1)}" text-anchor="middle" dominant-baseline="central" direction="${RTL?'rtl':'ltr'}" stroke-width="4">${t}</text>`;y+=f*lh/2;});

    const a=P[bi],b=P[bi+1],dx=b[0]-a[0],dy=b[1]-a[1],sl=Math.hypot(dx,dy)||1;

function selSVG(s,T){
  const g=geom(s),P=g.w.map(([x,y])=>[x*T.k+T.ox,y*T.k+T.oy]),C=[s.x*T.k+T.ox,s.y*T.k+T.oy];
  let o='';
  if(g.circle) o+=`<circle class="sel" cx="${C[0]}" cy="${C[1]}" r="${g.circle*T.k+5}"/>`;
  else if(g.closed) o+=`<polygon class="sel" points="${P.map(p=>p.join(',')).join(' ')}"/>`;
  if(focusSide!=null&&s.kind==='free'&&!g.circle){
    const i=focusSide,a=P[i],b=g.closed?P[(i+1)%P.length]:P[i+1];
    if(a&&b) o+=`<line class="hl" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  }
  if(!g.circle) P.forEach(p=>o+=`<circle class="vdot" cx="${p[0]}" cy="${p[1]}" r="4"/>`);
  if(!g.circle){
    const r=s.rot*Math.PI/180,ux=Math.sin(r),uy=-Math.cos(r),d0=g.hh*T.k,d1=d0+34;
    const hx=C[0]+ux*d1,hy=C[1]+uy*d1;
    o+=`<line class="rhl" x1="${C[0]+ux*d0}" y1="${C[1]+uy*d0}" x2="${hx}" y2="${hy}"/>`+
      `<g data-rot="1"><circle cx="${hx}" cy="${hy}" r="20" fill="transparent"/><circle class="rh" cx="${hx}" cy="${hy}" r="10"/>`+
      `<path d="M${hx+4.5} ${hy-1.5}a4.6 4.6 0 1 1-1.4-3.2M${hx+3.6} ${hy-6.2}v3.4h-3.4" fill="none" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round"/></g>`;
  }

}
function gridSVG(T,W,H){
  const U=IMP?FT:1,base=IMP?[1/12,0.25,0.5,1,2,5,10,25,50,100]:[0.1,0.25,0.5,1,2,5,10,25,50,100];
  const st=(base.find(x=>x*U*T.k>=16)||200)*U;
  const maj=st<U?U:st*5;let mi='',ma='';
  const xs=Math.floor(-T.ox/T.k/st)*st,ys=Math.floor(-T.oy/T.k/st)*st;
  for(let x=xs;x*T.k+T.ox<=W;x+=st){const X=Math.round(x*T.k+T.ox)+.5,isM=Math.abs(x/maj-Math.round(x/maj))<1e-4;(isM?(ma+=`M${X} 0V${H}`):(mi+=`M${X} 0V${H}`));}
  for(let y=ys;y*T.k+T.oy<=H;y+=st){const Y=Math.round(y*T.k+T.oy)+.5,isM=Math.abs(y/maj-Math.round(y/maj))<1e-4;(isM?(ma+=`M0 ${Y}H${W}`):(mi+=`M0 ${Y}H${W}`));}
  return `<path class="g-min" d="${mi}"/><path class="g-maj" d="${ma}"/>`;
}

/* ---------- storage ---------- */

const LS='sketcher.v1';

const clone=o=>JSON.parse(JSON.stringify(o));
const local={
  read(){try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return {}}},
  write(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}},

  put(s){const o=this.read();o.sketches=o.sketches||{};o.sketches[s.id]=s;this.write(o);},
  del(id){const o=this.read();if(o.sketches&&o.sketches[id]){delete o.sketches[id];this.write(o);}}

const plain=s=>clone({name:s.name||'',updated:s.updated||Date.now(),shapes:s.shapes||[],...(s.kind==='project'?{kind:'project',meta:s.meta||{},blocks:s.blocks||[]}:{})});

/* ---------- auto-save folder (desktop app) ---------- */
// Every sketch is mirrored to <folder>/<name> (<id>).sirtuti.json on each change. Picking a folder that
// Google Drive / OneDrive / Dropbox syncs gives a cloud backup. Files changed or added there are pulled in.
const folder={
  K:'sirtuti.folder',M:'sirtuti.folderFiles',warned:false,
  get path(){try{return localStorage.getItem(this.K)||''}catch(e){return ''}},
  set path(v){try{v?localStorage.setItem(this.K,v):localStorage.removeItem(this.K)}catch(e){}},
  map(){try{return JSON.parse(localStorage.getItem(this.M)||'{}')||{}}catch(e){return {}}},
  setMap(m){try{localStorage.setItem(this.M,JSON.stringify(m))}catch(e){}},
  fs(){return window.__TAURI__&&window.__TAURI__.fs},
  supported(){return IS_TAURI&&!!this.fs()&&!!(window.__TAURI__.dialog)},
  on(){return this.supported()&&!!this.path},
  join(n){const p=this.path,sep=p.includes('\\')?'\\':'/';return p.replace(/[\\/]+$/,'')+sep+n;},
  fname(s){const nm=(s.name||tt("סקיצה")).replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').trim().slice(0,60)||tt("סקיצה");return nm+' ('+String(s.id).slice(-6)+').sirtuti.json';},
  fail(){ if(!this.warned){this.warned=true;toast(tt("השמירה לתיקייה נכשלה. בדוק שהתיקייה קיימת"));} },
  async write(s){
    if(!this.on()) return;
    const fs=this.fs(),m=this.map(),n=this.fname(s),old=m[s.id],at=this.path;
    await fs.writeTextFile(this.join(n),JSON.stringify({app:'sirtuti',format:1,sketch:{id:s.id,...plain(s)}},null,1));
    if(old&&old!==n){try{await fs.remove(this.join(old));}catch(e){}}
    m[s.id]=n; this.setMap(m); this.warned=false;
    const cur=local.all()[s.id]; if(cur&&cur.updated===s.updated&&cur.inFolder!==at){cur.inFolder=at;local.put(cur);}
  },
  async remove(id){
    if(!this.on()) return; const m=this.map(),n=m[id]; if(!n) return;
    try{await this.fs().remove(this.join(n));}catch(e){}
    delete m[id]; this.setMap(m);
  },
  // read the folder; newer files win; files deleted on another computer remove the local copy
  async pull(){
    if(!this.on()) return 0;

    for(const e of ents){

      try{
        const d=JSON.parse(await fs.readTextFile(this.join(e.name))),s=d&&d.sketch;
        if(!s||!s.id||!Array.isArray(s.shapes)) continue;
        seen.add(s.id); m[s.id]=e.name;
        const cur=local.all()[s.id];
        if(!cur||(cur.updated||0)<(s.updated||0)){local.put({id:s.id,...plain(s),inFolder:at});n++;}
      }catch(err){}
    }
    Object.values(local.all()).forEach(s=>{if(s.inFolder===at&&!seen.has(s.id)){local.del(s.id);n++;}});
    this.setMap(m); return n;
  },
  async pushAll(){ for(const s of Object.values(local.all())) await this.write(s); },
  async choose(){

      if(!p||Array.isArray(p)) return false;
      this.path=p; this.setMap({}); this.warned=false;
      await this.pull(); await this.pushAll();

    }catch(e){ this.fail(); return false; }
  },
  stop(){ this.path=''; this.setMap({}); toast(tt("השמירה לתיקייה הופסקה. הקבצים שכבר נשמרו נשארים שם")); }
};
let syncSt='';
const store={remote:null,
  get mode(){return this.remote?this.remote.kind:'local'},
  async initClaude(){
    try{
      if(!window.claude||!window.claude.use) return;
      const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
      if(!user||!db) return; const id=await user.id(); if(!id) return;
      const col=()=>db.collection('data/users/'+id);
      this.remote={kind:'claude',uid:id,
        list:async()=>({docs:(await col().get()).docs.map(d=>({id:d.id,...d.data()})),fromServer:true}),
        save:(sid,body)=>col().doc(sid).set(body),
        remove:sid=>col().doc(sid).delete()};
    }catch(e){}
  },
  async list(){
    if(folder.on()){try{await folder.pull();}catch(e){folder.fail();}}
    const L=local.all(),all={};
    Object.values(L).forEach(s=>{if(s&&Array.isArray(s.shapes)) all[s.id]=s;});
    const r=this.remote;
    if(r){
      try{
        const {docs,fromServer}=await r.list(),ids=new Set(docs.map(d=>d.id));
        // deleted on another device: drop local copies that were confirmed in the cloud but are gone now
        if(r.kind==='firebase'&&fromServer) Object.values(L).forEach(s=>{if(s.cloud===r.uid&&!ids.has(s.id)){local.del(s.id);delete all[s.id];}});
        docs.forEach(o=>{
          if(!Array.isArray(o.shapes)) return; const cur=all[o.id];

  async save(s){

    if(folder.on()) folder.write({id:s.id,...body}).catch(()=>folder.fail());
    const r=this.remote; if(!r) return;
    if(r.kind==='claude'){ await r.save(s.id,body); return; }
    pushCloud(r,s.id,body);   // Firebase: never block on the server (works offline, syncs later)
  },
  async remove(id){
    local.del(id); if(folder.on()) folder.remove(id); const r=this.remote; if(!r) return;
    const p=r.remove(id); if(r.kind==='claude') await p; else p.catch(()=>{});
  }
};
function pushCloud(r,id,body){

    const cur=local.all()[id]; if(cur&&cur.updated===body.updated){cur.cloud=r.uid;local.put(cur);}
    if(store.remote===r) setSync('ok');
  }).catch(()=>{ if(store.remote===r) setSync('err'); });
}
function setSync(st){ syncSt=st; if(!saving&&!saveT&&!sk.example) setStatus(savedText()); }
let saveT=null,saving=false,again=false;

function savedText(){

  if(store.mode==='firebase') return syncSt==='pending'?tt("נשמר · מסנכרן ל-Google…"):syncSt==='err'?tt("נשמר במכשיר · הסנכרון ל-Google נכשל"):tt("נשמר בחשבון Google");
  return IS_TAURI?(folder.on()?tt("נשמר במחשב ובתיקייה"):tt("נשמר במחשב הזה")):tt("נשמר בדפדפן הזה");

/* ---------- Google account (Firebase) ---------- */
const cloud={fb:null,auth:null,fs:null,user:null,failed:false,
  configured(){const c=window.SIRTUTI_FIREBASE;return !!(c&&c.apiKey)&&!IS_TAURI&&!window.claude;},
  async init(){
    if(!this.configured()) return;
    $('#acctBtn').hidden=false;
    try{
      const fb=await import('./vendor/firebase.js'); this.fb=fb;
      const app=fb.initializeApp(window.SIRTUTI_FIREBASE);
      this.auth=fb.getAuth(app);
      try{this.fs=fb.initializeFirestore(app,{localCache:fb.persistentLocalCache({tabManager:fb.persistentMultipleTabManager()})});}
      catch(e){this.fs=fb.initializeFirestore(app,{});}
      fb.getRedirectResult(this.auth).catch(e=>toast(authErr(e)));
      fb.onAuthStateChanged(this.auth,u=>this.onUser(u));
    }catch(e){ this.failed=true; console.warn('Firebase unavailable',e); }
  },
  col(uid){return this.fb.collection(this.fs,'users',uid,'sketches');},
  async onUser(u){
    this.user=u; updAcct();
    if(!u){ if(store.mode==='firebase'){store.remote=null;syncSt='';if(!sk.example)setStatus(savedText());} return; }
    const fb=this.fb,id=u.uid,col=()=>this.col(id);
    const r={kind:'firebase',uid:id,
      list:async()=>{let snap,fromServer=true;
        try{snap=await fb.getDocsFromServer(col());}catch(e){snap=await fb.getDocs(col());fromServer=false;}
        return {docs:snap.docs.map(d=>({id:d.id,...d.data()})),fromServer};},
      save:(sid,body)=>fb.setDoc(fb.doc(col(),sid),body),
      remove:sid=>fb.deleteDoc(fb.doc(col(),sid))};
    store.remote=r;
    // upload sketches that so far exist only on this device
    try{
      const {docs}=await r.list(),cm={}; docs.forEach(d=>cm[d.id]=d);
      Object.values(local.all()).forEach(s=>{ if(s.cloud===id) return; const c=cm[s.id];
        if(!c||(c.updated||0)<(s.updated||0)) pushCloud(r,s.id,plain(s)); });
    }catch(e){}
    const list=(await store.list()).filter(x=>!isProj(x));
    if(sk.example&&undoS.length===0&&list.length) openSketch(clone(list[0]));
    else if(!sk.example){ store.save(sk); setStatus(savedText()); }
  },
  async signIn(){
    if(!this.fb){toast(tt("אין חיבור ל-Google כרגע"));return;}
    const p=new this.fb.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
    try{ await this.fb.signInWithPopup(this.auth,p); closeModal(); toast(tt("מחובר. הסקיצות יישמרו בחשבון Google")); }
    catch(e){
      const c=(e&&e.code)||'';
      if(/popup-blocked|operation-not-supported/.test(c)) return this.fb.signInWithRedirect(this.auth,p);
      if(/popup-closed|cancelled-popup/.test(c)) return;
      toast(authErr(e));
    }
  },
  async signOut(){ await this.fb.signOut(this.auth); closeModal(); toast(tt("התנתקת. הסקיצות נשארות גם במכשיר הזה")); }
};
function authErr(e){
  const c=(e&&e.code)||'';
  if(c.includes('unauthorized-domain')) return tt("הכתובת הזו לא מאושרת ב-Firebase (Authorized domains)");
  if(c.includes('network')) return tt("אין חיבור לאינטרנט");

}

/* ---------- history ---------- */

function commit(){
  const j=snap(); if(j===lastJSON) return;
  undoS.push(lastJSON); if(undoS.length>80) undoS.shift(); redoS=[]; lastJSON=j;
  scheduleSave(); updHist();
}

function redo(){ if(!redoS.length) return; undoS.push(lastJSON); lastJSON=redoS.pop(); sk.shapes=JSON.parse(lastJSON); afterHist(); }

/* ---------- render ---------- */

  let tot=0; sk.shapes.forEach(x=>{if(x.include!==false&&!isOpen(x)){tot+=measures(x,geom(x)).area;}});
  $('#totalA').textContent=fA(tot);
  $('#empty').hidden=sk.shapes.length>0;
  const SU=IMP?FT:1,L=([0.25,0.5,1,2,5,10,20,50,100,200].find(v=>v*SU*view.k>=50)||500)*SU;
  $('#scalebar i').style.width=(L*view.k)+'px'; $('#scalebar span').textContent=IMP?fL(L):(L<1?L.toFixed(2):L)+tt(" מ׳");
}
function fit(){

  if(!sk.shapes.length){view={k:40,ox:W/2,oy:avH/2};return;}
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  sk.shapes.forEach(s=>geom(s).w.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}));
  const bw=Math.max(x1-x0,0.5),bh=Math.max(y1-y0,0.5);
  const k=Math.max(4,Math.min(400,Math.min((W-70)/bw,(avH-110)/bh)));
  view={k,ox:W/2-(x0+x1)/2*k,oy:avH/2-(y0+y1)/2*k+(avH===H?-10:0)};
}

sheet.addEventListener('change',e=>{
  const t=e.target,s=cur(); if(!s) return;
  if(t.id==='t-closed'){
    if(!t.checked){ // closed -> open: keep the shape by turning the closing side into a real side
      let x=0,y=0,hd=0,last=0; s.p.segs.forEach(g=>{x+=g.len*Math.cos(hd);y+=g.len*Math.sin(hd);last=hd;hd+=(180-g.ang)*Math.PI/180;});
      const cl=Math.hypot(x,y);
      if(cl>0.01){ let tr=(Math.atan2(-y,-x)-last)*180/Math.PI; tr=((tr+180)%360+360)%360-180;
        s.p.segs[s.p.segs.length-1].ang=Math.round((180-tr)*10)/10; s.p.segs.push({len:Math.round(cl*100)/100,ang:90}); }
      s.p.open=true;
    }else s.p.open=false;
    render(); commit(); openPanel(); return;
  }
  if(t.dataset.t){ s[t.dataset.t]=t.checked; render(); updInfo(); }

sheet.addEventListener('click',e=>{

  const a=b.dataset.act; if(!a) return;

    case 'sym': s.p.o=Math.round((s.p.a-s.p.b)/2*1000)/1000; $('#f-o').value=dispLen(s.p.o); break;
    case 'segadd': s.p.segs.push({len:niceDef(2),ang:90}); render(); commit(); openPanel(); return;

    case 'dup': { const c=JSON.parse(JSON.stringify(s)); c.id=uid(); c.x+=0.5; c.y+=0.5; c.name=s.name?s.name+tt(" (עותק)"):''; sk.shapes.push(c); commit(); select(c.id); return; }

sheet.addEventListener('focusin',e=>{const t=e.target; if(t.dataset&&t.dataset.seg!=null){focusSide=+t.dataset.seg;render();}});

function select(id){ sel=id; openPanel(); render(); }

/* ---------- hand drawing ---------- */
const toW=p=>[(p.x-view.ox)/view.k,(p.y-view.oy)/view.k];
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;if(L2<1e-12)return dist(p,a);
  let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function rdp(P,eps){
  if(P.length<3) return P.slice(); let dm=0,ix=0; const a=P[0],b=P[P.length-1];
  for(let i=1;i<P.length-1;i++){const d=segDist(P[i],a,b);if(d>dm){dm=d;ix=i;}}
  if(dm>eps){const l=rdp(P.slice(0,ix+1),eps),r=rdp(P.slice(ix),eps);return l.slice(0,-1).concat(r);}
  return [a,b];
}
// snap side directions to 15° steps, merge straight runs, and (for closed shapes) nudge lengths so the outline closes cleanly
function straighten(P,closed){
  const step=Math.PI/12,n=P.length,m=closed?n:n-1,minL=12/view.k;
  let sides=[];
  for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%n],L=dist(a,b);if(L<minL)continue;
    sides.push({h:Math.round(Math.atan2(b[1]-a[1],b[0]-a[0])/step),L});}
  const same=(x,y)=>((x.h-y.h)%24+24)%24===0;
  const merged=[];sides.forEach(sd=>{const l=merged[merged.length-1];if(l&&same(l,sd))l.L+=sd.L;else merged.push({...sd});});
  if(closed) while(merged.length>1&&same(merged[0],merged[merged.length-1])){merged[0].L+=merged.pop().L;}
  sides=merged; if(sides.length<(closed?3:1)) return null;
  const hs=sides.map(sd=>sd.h*step);
  if(closed){
    let a=0,b=0,c=0,rx=0,ry=0;
    sides.forEach((sd,i)=>{const cs=Math.cos(hs[i]),sn=Math.sin(hs[i]);a+=cs*cs;b+=cs*sn;c+=sn*sn;rx+=cs*sd.L;ry+=sn*sd.L;});
    const det=a*c-b*b;
    if(Math.abs(det)>1e-9){const lx=(c*rx-b*ry)/det,ly=(a*ry-b*rx)/det;
      const nl=sides.map((sd,i)=>sd.L-(Math.cos(hs[i])*lx+Math.sin(hs[i])*ly));
      if(nl.every((v,i)=>v>sides[i].L*0.4)) nl.forEach((v,i)=>sides[i].L=v);}
  }
  sides.forEach(sd=>sd.L=Math.max(IMP?IN:0.05,snapLen(sd.L)));
  const out=[[0,0]],cnt=closed?sides.length-1:sides.length;
  for(let i=0;i<cnt;i++){const l=out[out.length-1];out.push([l[0]+sides[i].L*Math.cos(hs[i]),l[1]+sides[i].L*Math.sin(hs[i])]);}
  const bb=Q=>{let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;Q.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});return [(x0+x1)/2,(y0+y1)/2];};
  const c0=bb(P),c1=bb(out);
  return out.map(([x,y])=>[x+c0[0]-c1[0],y+c0[1]-c1[1]]);
}
function polyToShape(P,closed){
  let pts=P.map(p=>p.slice()); if(closed&&sarea(pts)<0) pts.reverse();
  const n=pts.length,hs=[],segs=[];
  for(let i=0;i<n-1;i++) hs.push(Math.atan2(pts[i+1][1]-pts[i][1],pts[i+1][0]-pts[i][0]));
  for(let i=0;i<n-1;i++){
    let ang=90; if(i<n-2){let t=(hs[i+1]-hs[i])*180/Math.PI;t=((t+180)%360+360)%360-180;ang=Math.round((180-t)*10)/10;}
    segs.push({len:Math.round(dist(pts[i],pts[i+1])*100)/100,ang});
  }
  const cnt=sk.shapes.filter(x=>x.kind==='free'&&!!x.p.open===!closed).length+1;
  const s={id:uid(),kind:'free',name:closed?tt("שרטוט ")+cnt:'',p:{segs,open:!closed},x:0,y:0,rot:normRot(hs[0]*180/Math.PI),color:PALETTE[sk.shapes.length%PALETTE.length]};
  const g=geom(s); s.x=Math.round((pts[0][0]-g.w[0][0])*1000)/1000; s.y=Math.round((pts[0][1]-g.w[0][1])*1000)/1000;
  return s;
}
function snapCand(w){
  const L=draw.pts[draw.pts.length-1],thr=14/view.k;
  if(draw.pts.length>=3&&dist(w,draw.pts[0])<thr*1.5) return {pt:draw.pts[0].slice(),start:true};
  if(magnet){let best=null,bd=thr;sk.shapes.forEach(s=>snapPts(s).forEach(q=>{const d=dist(w,q);if(d<bd){bd=d;best=q;}}));
    if(best) return {pt:best.slice()};}
  if(L&&magnet){let d=dist(L,w),a=Math.atan2(w[1]-L[1],w[0]-L[0]);a=Math.round(a/(Math.PI/12))*(Math.PI/12);d=snapLen(d);
    return {pt:[L[0]+d*Math.cos(a),L[1]+d*Math.sin(a)]};}
  return {pt:w};
}
function drawOverlay(){
  if(!draw) return '';
  const S=w=>[w[0]*view.k+view.ox,w[1]*view.k+view.oy],J=Q=>Q.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  if(draw.stroke) return `<polyline class="dstroke" points="${J(draw.stroke.map(S))}"/>`;
  const P=draw.pts.map(S); let o='';
  const lab=(a,b,L)=>{const x=(a[0]+b[0])/2,y=(a[1]+b[1])/2-12;return `<text class="ca" x="${x}" y="${y}" font-size="13" text-anchor="middle" stroke-width="4">${fL(L)}</text>`;};
  if(P.length>1) o+=`<polyline class="dline" points="${J(P)}"/>`;
  for(let i=0;i<P.length-1;i++) o+=lab(P[i],P[i+1],dist(draw.pts[i],draw.pts[i+1]));
  if(draw.prev){const q=S(draw.prev.pt);
    if(P.length){const a=P[P.length-1];o+=`<line class="dprev" x1="${a[0]}" y1="${a[1]}" x2="${q[0]}" y2="${q[1]}"/>`+lab(a,q,dist(draw.pts[draw.pts.length-1],draw.prev.pt));}
    o+=`<circle class="dcur" cx="${q[0]}" cy="${q[1]}" r="${draw.prev.start?13:7}"/>`;}
  P.forEach((p,i)=>{const st=i===0&&P.length>=3;o+=`<circle class="${st?'dstart':'dvtx'}" cx="${p[0]}" cy="${p[1]}" r="${st?9:4.5}"/>`;});
  return o;
}
function updDrawBar(){
  $('#drawbar').hidden=!draw; svg.classList.toggle('drawing',!!draw);
  if(!draw) return;
  $('#addGroup').hidden=true;
  $('#dmPts').classList.toggle('on',draw.mode==='pts'); $('#dmFree').classList.toggle('on',draw.mode==='free');
  $('#dUndo').hidden=$('#dDone').hidden=draw.mode!=='pts';
  $('#dUndo').disabled=!draw.pts.length; $('#dDone').disabled=draw.pts.length<2;
  $('#dhint').textContent=draw.mode==='pts'
    ?(draw.pts.length<3?tt("גע בלוח כדי לסמן נקודות. אפשר לגרור לפני שמרימים את האצבע."):tt("לסגירת הצורה גע בנקודת ההתחלה (העיגול הגדול). „סיום\" משאיר קו פתוח בנקודה האחרונה."))
    :tt("צייר עם האצבע. אם תסיים ליד נקודת ההתחלה הצורה תיסגר. הקווים מתיישרים אוטומטית.");
}
function startDraw(){ select(null); draw={mode:drawMode,pts:[],prev:null,stroke:null}; updDrawBar(); render(); }
function endDraw(){ draw=null; updDrawBar(); $('#addGroup').hidden=false; render(); }
function finishDraw(closed,P){
  P=P||draw.pts;
  if(P.length<(closed?3:2)){toast(closed?tt("צורה סגורה צריכה לפחות 3 נקודות"):tt("צריך לפחות 2 נקודות"));return;}
  const s=polyToShape(P,closed); sk.shapes.push(s); commit(); endDraw(); select(s.id);
  toast(tt("אפשר עכשיו לתקן את אורך כל צלע בחלונית"));
}
function drawDown(p){
  if(draw.mode==='free'){draw.stroke=[toW(p)];}
  else draw.prev=snapCand(toW(p));
  act={type:'drawing'}; render();
}
function drawMove(p){
  if(draw.mode==='free'&&draw.stroke){const w=toW(p),l=draw.stroke[draw.stroke.length-1];if(dist(w,l)*view.k>2){draw.stroke.push(w);render();}}
  else if(draw.mode==='pts'){draw.prev=snapCand(toW(p));render();}
}
function drawUp(p){
  if(draw.mode==='free'){
    let P=draw.stroke; draw.stroke=null; if(!P||P.length<2){render();return;}
    P=rdp(P,8/view.k); let closed=false;
    if(P.length>=4&&dist(P[0],P[P.length-1])*view.k<40){closed=true;P.pop();}
    if(magnet){const Q=straighten(P,closed); if(Q) P=Q;}
    if(P.length<(closed?3:2)||(!closed&&dist(P[0],P[P.length-1])*view.k<10)){toast(tt("הקו קצר מדי, נסה שוב"));render();return;}
    finishDraw(closed,P); return;
  }
  const c=snapCand(toW(p)); draw.prev=null;
  if(c.start){finishDraw(true);return;}
  const l=draw.pts[draw.pts.length-1];
  if(!l||dist(l,c.pt)*view.k>=8) draw.pts.push(c.pt);
  updDrawBar(); render();
}
$('#drawBtn').onclick=startDraw;
$('#dmPts').onclick=()=>{drawMode='pts';draw.mode='pts';draw.stroke=null;updDrawBar();render();};
$('#dmFree').onclick=()=>{drawMode='free';draw.mode='free';draw.pts=[];draw.prev=null;updDrawBar();render();};
$('#dUndo').onclick=()=>{draw.pts.pop();updDrawBar();render();};
$('#dDone').onclick=()=>finishDraw(false);
$('#dCancel').onclick=endDraw;

/* ---------- adding ---------- */
function showPicker(){

    Object.keys(KIND_LABEL).map(k=>`<button class="pick" data-kind="${k}"><svg viewBox="0 0 40 30">${PICK_ICON[k]}</svg>${KIND_LABEL[k]}</button>`).join('')+

/* ---------- pointer interaction ---------- */
const ptrs=new Map(); let act=null;
function spt(e){const r=svg.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function snapPts(s){const g=geom(s);return g.circle?[[s.x-g.circle,s.y],[s.x+g.circle,s.y],[s.x,s.y-g.circle],[s.x,s.y+g.circle]]:g.w;}
svg.addEventListener('pointerdown',e=>{
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  const p=spt(e); ptrs.set(e.pointerId,p);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    if(act&&act.moved&&(act.type==='drag'||act.type==='rot')) commit();
    if(draw){draw.prev=null;draw.stroke=null;}
    act={type:'pinch',d0:Math.hypot(b.x-a.x,b.y-a.y)||1,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...view}};
    return;
  }
  if(ptrs.size>2) return;
  if(draw){drawDown(p);return;}
  const rt=e.target.closest&&e.target.closest('[data-rot]'),sh=e.target.closest&&e.target.closest('[data-id]');
  if(rt&&cur()){ act={type:'rot',moved:false}; }
  else if(sh){
    const s=sk.shapes.find(x=>x.id===sh.dataset.id); if(!s) return;
    if(sel!==s.id) select(s.id);
    const rel=snapPts(s).map(([x,y])=>[x-s.x,y-s.y]);
    const others=[]; sk.shapes.forEach(o=>{if(o!==s) snapPts(o).forEach(q=>others.push(q));});
    act={type:'drag',s,sx:p.x,sy:p.y,x0:s.x,y0:s.y,rel,others,moved:false};
  }else act={type:'pan',sx:p.x,sy:p.y,ox:view.ox,oy:view.oy,moved:false};
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; const p=spt(e); ptrs.set(e.pointerId,p);
  if(!act) return;

    const [a,b]=[...ptrs.values()],d=Math.hypot(b.x-a.x,b.y-a.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const k=Math.max(3,Math.min(600,act.v0.k*d/act.d0));
    const wx=(act.m0.x-act.v0.ox)/act.v0.k,wy=(act.m0.y-act.v0.oy)/act.v0.k;
    view={k,ox:m.x-wx*k,oy:m.y-wy*k}; render(); return;
  }
  if(act.type==='drawing'){ if(draw) drawMove(p); return; }
  if(act.type==='pan'){
    if(!act.moved&&Math.hypot(p.x-act.sx,p.y-act.sy)<5) return; act.moved=true;
    view.ox=act.ox+p.x-act.sx; view.oy=act.oy+p.y-act.sy; render();
  }else if(act.type==='drag'){
    if(!act.moved&&Math.hypot(p.x-act.sx,p.y-act.sy)<3) return; act.moved=true;
    let nx=act.x0+(p.x-act.sx)/view.k, ny=act.y0+(p.y-act.sy)/view.k;
    if(magnet){
      const thr=11/view.k; let bx=thr,by=thr,ax=0,ay=0;
      act.rel.forEach(([rx,ry])=>{const vx=nx+rx,vy=ny+ry; act.others.forEach(([qx,qy])=>{const dx=qx-vx,dy=qy-vy; if(Math.abs(dx)<Math.abs(bx)){bx=dx;ax=dx;} if(Math.abs(dy)<Math.abs(by)){by=dy;ay=dy;}});});

  }else if(act.type==='rot'){
    const s=cur(); if(!s) return; act.moved=true;
    const cx=s.x*view.k+view.ox,cy=s.y*view.k+view.oy;
    let a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;
    a=magnet?Math.round(a/15)*15:Math.round(a);

});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);

  if(ptrs.size>0) return;
  if(act.type==='drawing'){ act=null; if(!draw) return;
    if(e.type==='pointerup') drawUp(spt(e)); else {draw.prev=null;draw.stroke=null;render();}
    return; }
  if((act.type==='drag'||act.type==='rot')&&act.moved) commit();

const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
// Save a generated file: desktop app → native save dialog; browser → normal download; Claude → downloads capability.
async function saveFile(name,data,ext,label){
  const T=window.__TAURI__;
  if(IS_TAURI&&T&&T.dialog&&T.fs){
    const path=await T.dialog.save({defaultPath:name,filters:[{name:label,extensions:[ext]}]});
    if(!path) return 'cancel';
    if(typeof data==='string') await T.fs.writeTextFile(path,data);
    else await T.fs.writeFile(path,new Uint8Array(await data.arrayBuffer()));
    return 'saved';
  }
  if(window.claude){
    const dl=await dlP; if(!dl) return 'fallback';
    try{ await dl.save({filename:name,data}); return 'saved'; }catch(e){ return e&&e.code==='declined'?'cancel':'fallback'; }
  }
  const blob=typeof data==='string'?new Blob([data],{type:'application/json'}):data;
  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
  return 'saved';
}
async function backupOut(list){

  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const json=JSON.stringify({app:'sirtuti',format:1,exported:d.toISOString(),sketches:list.map(s=>({id:s.id,...plain(s)}))},null,1);
  try{ const r=await saveFile('sirtuti-backup-'+ds+'.json',json,'json',tt("גיבוי שרטוטי"));
    if(r==='saved') toast(tt("נשמר גיבוי של ")+list.length+tt(" סקיצות")); else if(r==='fallback') toast(tt("שמירת קבצים לא זמינה כאן")); }
  catch(e){ toast(tt("שמירת הגיבוי נכשלה")); }
}
async function backupIn(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast(tt("הקובץ לא נקרא: זה לא קובץ גיבוי של שרטוטי")); return; }
  const arr=Array.isArray(data&&data.sketches)?data.sketches:null;
  if(!arr){ toast(tt("הקובץ לא נקרא: זה לא קובץ גיבוי של שרטוטי")); return; }
  const have=local.all(); let n=0;

    await store.save({id,...plain(s)}); n++;
  }

}

async function svgPng(ex,scale){
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ex.svg); await img.decode();
  const c=document.createElement('canvas'); c.width=Math.round(ex.w*scale); c.height=Math.round(ex.h*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function exportWord(){
  if(!doc) return; await saveDocNow(); toast(tt("מכין קובץ Word…"));
  let D; try{ D=await import('./vendor/docx.js'); }catch(e){ toast(tt("ייצוא ל-Word לא זמין כרגע")); return; }
  const {Document,Packer,Paragraph,TextRun,ImageRun,HeadingLevel,Table,TableRow,TableCell,WidthType,BorderStyle,ShadingType}=D;
  const R=(text,o={})=>new TextRun({text:String(text??''),rightToLeft:RTL,font:'Arial',size:o.size||22,sizeComplexScript:o.size||22,
    bold:!!o.bold,boldComplexScript:!!o.bold,color:o.color,strike:!!o.strike});
  const P=(kids,o={})=>new Paragraph({bidirectional:RTL,children:[].concat(kids),heading:o.heading,

// Pages are drawn on canvases (the browser handles Hebrew/RTL shaping), then packed into a PDF as JPEG images.
function pdfFromCanvases(canvases){

  obj(2,()=>push('<< /Type /Pages /Kids ['+canvases.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>'));
  canvases.forEach((c,i)=>{

    obj(cn,()=>{push('<< /Length '+cs.length+' >>\nstream\n');push(cs);push('\nendstream');});
    obj(im,()=>{push('<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');push(bytes);push('\nendstream');});
  });

      a.groups.forEach(g=>{ rows.push({cells:[g.name,''],bold:true,fill:'#F3F4F0',span:true});
        g.rows.forEach(r=>rows.push({cells:[r.name,fA(r.area)]})); if(multi) rows.push({cells:[tt('סה״כ'),fA(g.total)],bold:true}); });
      rows.push({cells:[multi?tt('סה״כ בפרויקט'):tt('סה״כ'),fA(a.total)],bold:true,fill:'#F6E3D8'});
      P.table([{w:.7},{w:.3,end:true}],rows); }
  }
  return P.finish(tt('הסקיצות להערכה בלבד ואינן מדידה מדויקת.'));
}
const safeName=(n,fb)=>(String(n||'').replace(/[\\/:*?"<>|]+/g,' ').trim()||fb);
async function savePdf(blob,name){
  if(!blob){toast(tt('אין צורות לשמירה'));return;}
  try{ const r=await saveFile(name+'.pdf',blob,'pdf','PDF');
    if(r==='saved') toast(tt('קובץ ה-PDF נשמר')); else if(r==='cancel') $('#toast').hidden=true; else toast(tt('שמירת קבצים לא זמינה כאן')); }
  catch(e){ toast(tt('שמירת הקובץ נכשלה')); }
}
function exportMenu(opts){
  modal(`<h2>${tt('ייצוא')}<button class="ib" data-close aria-label="${esc(tt('סגירה'))}">${ic('x')}</button></h2><div class="expopts">`+
    opts.map((o,i)=>`<button class="expopt" data-exp="${i}">${ic(o.icon)}<span><b>${o.label}</b><small>${o.desc}</small></span></button>`).join('')+`</div>`);
  modalEl.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{closeModal();opts[+b.dataset.exp].run();});
}

/* ---------- settings ---------- */
function showSettings(){
  modal(`<h2>${tt('הגדרות')}<button class="ib" data-close aria-label="${esc(tt('סגירה'))}">${ic('x')}</button></h2>
    <div class="setg"><b>${tt('שפה')}</b><div class="tabs">
      <button data-lang="he" class="${LANG==='he'?'on':''}" lang="he">עברית</button><button data-lang="en" class="${LANG==='en'?'on':''}" lang="en">English</button><button data-lang="fr" class="${LANG==='fr'?'on':''}" lang="fr">Français</button></div></div>
    <div class="setg"><b>${tt('יחידות מידה')}</b><div class="tabs">
      <button data-units="m" class="${!IMP?'on':''}">${tt('מטרי')}<small>${tt('מ׳')} · ${tt('מ״ר')}</small></button>
      <button data-units="ft" class="${IMP?'on':''}">${tt('אמריקאי')}<small>ft · in · ft²</small></button></div>
      <div class="hint">${tt('המידות נשמרות תמיד במדויק, ושינוי היחידות משנה רק את התצוגה וההזנה. ביחידות אמריקאיות מקלידים למשל 12\' 6" או 12.5.')}</div></div>`);
  const apply=async(k,v)=>{ try{localStorage.setItem(k,v);}catch(e){} await flushSketch(); if(doc&&docSaveT) await saveDocNow(); location.reload(); };
  modalEl.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ if(b.dataset.lang!==LANG) apply('sirtuti.lang',b.dataset.lang); });
  modalEl.querySelectorAll('[data-units]').forEach(b=>b.onclick=()=>{ if(b.dataset.units!==UNITS) apply('sirtuti.units',b.dataset.units); });
}

/* ---------- boot ---------- */
openSketch(sampleSketch());
$('#acctBtn').onclick=showAcct;
if(IS_TAURI) window.addEventListener('focus',async()=>{
  if(!folder.on()||saveT||saving) return;
  try{ await folder.pull(); const cur=local.all()[sk.id];
    if(cur&&(cur.updated||0)>(sk.updated||0)&&undoS.length===0) openSketch(clone(cur)); }catch(e){}
});
store.initClaude().then(async()=>{
  const all=await store.list(),list=all.filter(x=>!isProj(x));
  if(list.length&&sk.example&&undoS.length===0) openSketch(clone(list[0]));
  else if(!sk.example) setStatus(savedText());
  const v=getView(),pv=v&&all.find(x=>x.id===v&&isProj(x)); if(pv) openDoc(pv);
  cloud.init();
});
})();
